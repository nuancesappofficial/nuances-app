<!doctype html>
<html><head><meta charset="utf-8">
<!-- 輪播圖模板（雜誌風，slides.json 設 "style": "editorial" 時使用）。資料格式、網址參數與 slides.html 相同：?i=<頁序 0 起>&h=<高>。 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&family=Inter:wght@400;500;600&display=block">
<style>
  :root { --h: 1350px; --ink: #FFFFFF; --soft: rgba(255,255,255,.82); --mute: rgba(255,255,255,.62); --blue: #4EAFF4; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: var(--h); overflow: hidden; background: #111; }
  body { color: var(--ink); -webkit-font-smoothing: antialiased; font-family: "Inter", "Noto Sans TC", sans-serif; }
  .slide { width: 1080px; height: var(--h); position: relative; overflow: hidden; }
  .photo { position: absolute; inset: 0; background-size: cover; background-position: center; }
  .serif-zh { font-family: "Noto Serif TC", serif; font-weight: 900; }
  .serif-en { font-family: "DM Serif Display", serif; font-weight: 400; }
  /* 左上品牌字（雜誌刊頭） */
  .mast { position: absolute; top: 70px; left: 84px; z-index: 1; font-size: 132px; line-height: 1; letter-spacing: -2px;
    text-shadow: 0 2px 20px rgba(0,0,0,.25); }
  .count { position: absolute; top: 96px; right: 90px; z-index: 4; font-size: 26px; font-weight: 500; color: var(--mute); letter-spacing: 2px; }
  .text { position: absolute; left: 90px; right: 90px; bottom: 120px; z-index: 3; }
  .hl { color: var(--blue); }
  /* 中文標題不留孤字在第二行 */
  .cover h1, .q-zh, .cta h2 { text-wrap: balance; }

  /* 每頁劇照共用同一層漸層：上緣微暗襯刊頭、下半段壓暗放字 */
  .shade { position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,.3) 0%, rgba(0,0,0,0) 20%, rgba(0,0,0,0) 38%, rgba(0,0,0,.6) 58%, rgba(0,0,0,.9) 100%); }

  /* ---------- 封面：人像 + 底部標題 ---------- */
  /* 人物去背層：同一張劇照 + 同一層漸層，用 person_mask.swift 的遮罩只留人物，蓋在刊頭字上面 */
  .fg { position: absolute; inset: 0; z-index: 2; -webkit-mask-size: cover; mask-size: cover;
    -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; }
  /* 集數標籤：右下角藍底膠囊 */
  /* 集數：右下角，細線 + 小字 PART + 襯線大數字，跟英文副標底部對齊 */
  .tag { position: absolute; right: 90px; bottom: 120px; z-index: 4; text-align: right; padding-top: 14px;
    border-top: 3px solid var(--ink); min-width: 200px; }
  .tag .lbl { display: block; font-size: 24px; font-weight: 600; letter-spacing: 8px; color: var(--soft); }
  .tag .num { display: block; font-size: 92px; line-height: 1; margin-top: 6px; }
  .tag .num i { font-size: 52px; color: var(--soft); margin: 0 8px; }
  .cover .dek { max-width: 600px; }
  .cover h1 { font-size: 92px; line-height: 1.22; letter-spacing: 1px; }
  .cover .wrong { font-size: 104px; line-height: 1.1; font-style: italic; position: relative; display: inline-block; margin-top: 4px; white-space: nowrap; }
  .cover .wrong::after { content: ""; position: absolute; left: -8px; right: -12px; top: 56%; height: 7px;
    background: var(--blue); transform: rotate(-2.5deg); }
  .cover .dek { margin-top: 40px; font-size: 38px; line-height: 1.4; color: var(--soft); }
  .cover .dek .zh { display: block; font-size: 32px; color: var(--mute); margin-top: 6px; }

  /* ---------- 單字頁：劇照 + 大引號 + 台詞 ---------- */
  .quote-mark { font-size: 300px; line-height: .6; height: 130px; margin-left: -8px; }
  .q-zh { font-size: 64px; line-height: 1.32; margin-top: 18px; }
  .q-en { font-size: 40px; line-height: 1.38; color: var(--soft); margin-top: 26px; }
  .q-en .hl { font-weight: 600; }
  .gloss { margin-top: 44px; }
  .gloss .w { font-size: 64px; line-height: 1.05; font-style: italic; color: var(--blue); }
  .gloss .ipa { font-family: "Inter", sans-serif; font-style: normal; font-size: 30px; color: var(--mute); margin-left: 18px; }
  .gloss .d { font-size: 36px; color: var(--soft); margin-top: 12px; font-family: "Noto Sans TC", sans-serif; font-weight: 500; }
  .gloss .d .pos { color: var(--mute); margin-right: 16px; }

  /* ---------- CTA ---------- */
  .cta { background: #0E0E10; }
  .cta .photo { filter: brightness(.45); }
  .cta .stack { position: absolute; left: 0; right: 0; top: 40px; height: 640px; z-index: 3;
    transform: scale(.78); transform-origin: 50% 0; }   /* 4:5 / 3:4 高度不夠，卡片縮小給文字讓位 */
  .card { position: absolute; left: 50%; width: 420px; background: #FFF; color: #111;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", sans-serif; border-radius: 34px; overflow: hidden;
    box-shadow: 0 30px 60px rgba(0,0,0,.45), 0 4px 12px rgba(0,0,0,.25); }
  .card .img { height: 230px; background-size: cover; background-position: center; }
  .card .c-body { padding: 26px 34px 34px; }
  .card .w { font-size: 56px; line-height: 1.08; font-weight: 900; letter-spacing: -2.4px; white-space: nowrap; }
  .card .m { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
  .card .pos { flex: none; padding: 5px 14px; border-radius: 999px; background: #E7E9EF; color: #6B7280; font-size: 20px; font-weight: 800; }
  .card .d { font-size: 28px; font-weight: 700; letter-spacing: -.8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card.l { transform: translate(-50%, 190px) translateX(-250px) rotate(-7deg); }
  .card.r { transform: translate(-50%, 190px) translateX(250px) rotate(7deg); }
  .card.c { transform: translate(-50%, 0) rotate(-1deg); }
  .cta .text { text-align: center; }
  .cta h2 { font-size: 72px; line-height: 1.22; }
  .cta .text { bottom: 70px; }
  .cta .sub { font-size: 32px; color: var(--soft); margin-top: 22px; }
  .cta .badges { display: flex; justify-content: center; gap: 22px; margin-top: 36px; }
  .cta .badges img { height: 92px; }
  .cta .app { margin-top: 34px; }
  .cta .app img { width: 120px; height: 120px; border-radius: 34px; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
  .cta .app div { font-size: 38px; font-weight: 500; margin-top: 16px; font-family: "Noto Sans TC", sans-serif; }

  /* ---------- 9:16 安全區 ---------- */
  .tall .mast { top: 160px; }
  .tall .count { top: 182px; }
  .tall .text { bottom: 400px; right: 180px; }
  .tall .tag { bottom: 400px; right: 180px; }
  .tall .cover .dek { max-width: 480px; }
  .tall .cta .text { right: 90px; }
  .tall .cta .stack { top: calc(var(--h) * .14); transform: none; }
  .tall .cta .text { bottom: 360px; }
  .tall .cta h2 { font-size: 84px; }
  .tall .cta .app img { width: 150px; height: 150px; }
</style></head>
<body>
<script src="data.js"></script>
<script>
const D = window.DATA;
const qs = new URLSearchParams(location.search);
const i = +qs.get('i') || 0;
const H = +qs.get('h') || 1350;
document.documentElement.style.setProperty('--h', H + 'px');
if (H >= 1900) document.documentElement.classList.add('tall');
const n = D.words.length, total = n + 2;
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
// 文案語法：| 斷行、[文字] 標藍
const rich = s => esc(s).replace(/\[([^\]]+)\]/g, '<span class="hl">$1</span>').replace(/\|/g, '<br>');
const mark = (s, m) => {
  const k = s.toLowerCase().indexOf(m.toLowerCase());
  return k < 0 ? esc(s) : esc(s.slice(0, k)) + '<span class="hl">' + esc(s.slice(k, k + m.length)) + '</span>' + esc(s.slice(k + m.length));
};
const count = `<div class="count">${i + 1}/${total}</div>`;
const head = `<div class="mast serif-en">Nuances</div>${count}`;
// 「PART 1 OF 4」拆成小字 PART + 大數字；其他寫法原樣顯示
const tag = t => { const m = t.match(/^part\s*(\d+)\s*(?:of|\/)\s*(\d+)$/i);
  return `<div class="tag">${m ? `<span class="lbl">PART</span><span class="num serif-en">${m[1]}<i>of</i>${m[2]}</span>` : esc(t)}</div>`; };
const photo = (src, pos) => `<div class="photo" style="background-image:url(${src});background-position:${pos || 'center'}"></div>`;
// 劇照 + 漸層；有遮罩時再疊一份只留人物的，刊頭字就夾在中間
const scene = (src, pos, mask) => photo(src, pos) + '<div class="shade"></div>' + (mask
  ? `<div class="fg" style="-webkit-mask-image:url(${mask});mask-image:url(${mask});-webkit-mask-position:${pos || 'center'};mask-position:${pos || 'center'}">${photo(src, pos)}<div class="shade"></div></div>`
  : '');

let html;
if (i === 0) {
  // hook：[錯誤說法] 那行用藍線劃掉，其他行合成標題；sub 用「英文 || 中文」寫兩行副標
  const c = D.cover;
  const parts = c.hook.split('|');
  const title = parts.filter(l => !/^\s*\[[^\]]+\]\s*$/.test(l)).map(rich).join('<br>');
  const wrong = parts.map(l => l.trim().match(/^\[([^\]]+)\]$/)).find(Boolean);
  const [dekEn, dekZh] = (c.sub || '').split('||');
  html = `<div class="slide cover">${scene(c.image, c.focus || '50% 30%', c.mask)}${head}
    ${c.tag ? tag(c.tag) : ''}<div class="text">
      <h1 class="serif-zh">${title}</h1>${wrong ? `<div class="wrong serif-en">${esc(wrong[1])}</div>` : ''}
      <div class="dek">${esc(dekEn || '')}${dekZh ? `<span class="zh">${esc(dekZh)}</span>` : ''}</div></div></div>`;
} else if (i <= n) {
  const w = D.words[i - 1];
  html = `<div class="slide word-slide">${scene(w.image, w.focus, w.mask)}${head}
    <div class="text"><div class="quote-mark serif-en">“</div>
      <div class="q-zh serif-zh">${esc(w.translation)}</div>
      <div class="q-en">${mark(w.sentence, w.match || w.word)}</div>
      <div class="gloss"><div><span class="w serif-en">${esc(w.word)}</span><span class="ipa">${esc(w.ipa || '')}</span></div>
        <div class="d"><span class="pos">${esc(w.pos || '')}</span>${esc(w.definition)}</div></div></div></div>`;
} else {
  const c = D.cta, picks = D.words.slice(-3), pos = { 1: ['c'], 2: ['l', 'r'], 3: ['l', 'r', 'c'] }[picks.length];
  const cards = picks.map((w, k) => `<div class="card ${pos[k]}"><div class="img" style="background-image:url(${w.image});background-position:${w.focus || 'center'}"></div>
    <div class="c-body"><div class="w">${esc(w.word)}</div>
      <div class="m">${w.pos ? `<span class="pos">${esc(w.pos)}</span>` : ''}<span class="d">${esc(w.definition.split(/[；;]/)[0])}</span></div></div></div>`).join('');
  html = `<div class="slide cta">${scene(D.cover.image, D.cover.focus, D.cover.mask)}${count}<div class="stack">${cards}</div>
    <div class="text"><h2 class="serif-zh">${rich(c.headline.replace('{n}', n))}</h2>${c.sub ? `<div class="sub">${rich(c.sub)}</div>` : ''}
      <div class="badges"><img src="badge_appstore_zh-TW.png"><img src="badge_play_zh-TW.png"></div>
      <div class="app"><img src="icon.png"><div>${esc(c.app || 'Nuances: 英文單字卡')}</div></div></div></div>`;
}
document.body.insertAdjacentHTML('beforeend', html);

// 人物擋住刊頭字超過 40% 就不疊人物（例如前景有個糊掉的肩膀），刊頭字整個露出來
const occlusion = fg => new Promise(done => {
  const mast = document.querySelector('.mast'), ph = fg.querySelector('.photo');
  if (!mast) return done();
  const img = new Image();
  img.onload = () => {
    const r = mast.getBoundingClientRect(), sc = Math.max(1080 / img.width, H / img.height);
    const [px, py] = getComputedStyle(ph).backgroundPosition.split(' ').map(v => parseFloat(v) / 100);
    const ox = (1080 - img.width * sc) * px, oy = (H - img.height * sc) * py;
    const cv = document.createElement('canvas'); cv.width = 1080; cv.height = H;
    const g = cv.getContext('2d'); g.drawImage(img, ox, oy, img.width * sc, img.height * sc);
    const a = g.getImageData(r.left, r.top, r.width, r.height).data;
    let on = 0; for (let k = 3; k < a.length; k += 4) on += a[k] > 128;
    if (on / (a.length / 4) > .4) fg.remove();
    done();
  };
  img.onerror = () => done();
  img.src = getComputedStyle(fg).maskImage.slice(5, -2);
});

// 中文台詞折行時，盡量斷在標點後面，不要把詞拆開
const breakAtPunct = el => {
  const lh = parseFloat(getComputedStyle(el).lineHeight);
  if (el.offsetHeight < lh * 1.5 || el.textContent.length < 8) return;
  const t = el.textContent, mid = t.length / 2;
  const cand = [...t.matchAll(/[，、；：]/g)].map(m => m.index + 1).filter(k => k > 3 && k < t.length - 3);
  if (!cand.length) return;
  const k = cand.sort((a, b) => Math.abs(a - mid) - Math.abs(b - mid))[0];
  el.innerHTML = esc(t.slice(0, k)) + '<br>' + esc(t.slice(k));
};

document.fonts.ready.then(async () => {
  await Promise.all([...document.querySelectorAll('.fg')].map(occlusion));
  document.querySelectorAll('.q-zh, .cover h1').forEach(el => el.querySelector('br') || breakAtPunct(el));
  // 錯誤說法要一行才劃得到線，太長就縮
  document.querySelectorAll('.cover .wrong').forEach(el => {
    const max = el.parentElement.clientWidth, fs = parseFloat(getComputedStyle(el).fontSize);
    if (el.scrollWidth > max) el.style.fontSize = fs * max / el.scrollWidth + 'px';
  });
  document.querySelectorAll('.card .w').forEach(el => {
    const ps = getComputedStyle(el.parentElement), fs = parseFloat(getComputedStyle(el).fontSize);
    const max = el.parentElement.clientWidth - parseFloat(ps.paddingLeft) - parseFloat(ps.paddingRight);
    if (el.scrollWidth > max) el.style.fontSize = fs * max / el.scrollWidth + 'px';
  });
  // 字太多時逐步縮字，直到文字區不壓到刊頭
  const box = document.querySelector('.cover .text, .word-slide .text');
  if (!box) return;
  const limit = H * (box.closest('.cover') ? .3 : .34);
  const shrink = [...box.querySelectorAll('h1, .wrong, .q-zh, .q-en, .gloss .w, .gloss .d')];
  const base = shrink.map(el => parseFloat(getComputedStyle(el).fontSize));
  for (let s = 1; s > 0.6 && box.getBoundingClientRect().top < limit; s -= 0.04)
    shrink.forEach((el, k) => el.style.fontSize = base[k] * s + 'px');
});
</script>
</body></html>
