<!doctype html>
<html><head><meta charset="utf-8">
<!-- 輪播圖模板（暗色海報風，寬 1080；高度看 ?h=：1350 = 4:5、1440 = 3:4、1920 = 9:16）。render_slides.py 會在同資料夾寫 data.js（window.DATA），用 ?i=<頁序 0 起>&h=<高> 截圖。 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Inter:wght@500;600;700;800;900&display=block">
<style>
  :root { --h: 1350px; --bg: #0E0F12; --ink: #F5F6F8; --mute: #9BA1AB; --blue: #4EAFF4; --line: rgba(255,255,255,.12); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: var(--h); overflow: hidden; background: var(--bg); }
  body { font-family: "Inter", "Noto Sans TC", "PingFang TC", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  .slide { width: 1080px; height: var(--h); position: relative; overflow: hidden; }
  .zh { font-family: "Noto Sans TC", "PingFang TC", sans-serif; }

  /* 每頁共用的頂列 / 底列 */
  .top { position: absolute; top: 56px; left: 64px; right: 64px; display: flex; justify-content: space-between;
    align-items: center; z-index: 3; font-size: 26px; font-weight: 700; letter-spacing: 3px; color: rgba(255,255,255,.75); }
  .top .num { letter-spacing: 1px; }
  .foot { position: absolute; bottom: 52px; left: 64px; right: 64px; display: flex; justify-content: space-between;
    align-items: center; z-index: 3; font-size: 26px; font-weight: 600; color: rgba(255,255,255,.6); }
  .foot .brand { display: flex; align-items: center; gap: 14px; }
  .foot img { width: 46px; height: 46px; border-radius: 12px; }
  .swipe { font-weight: 700; color: var(--ink); letter-spacing: 1px; }

  /* ---------- 封面 ---------- */
  .cover .photo { position: absolute; inset: 0; background-size: cover; }
  .cover .shade { position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(14,15,18,.55) 0%, rgba(14,15,18,0) 22%, rgba(14,15,18,.15) 42%, rgba(14,15,18,.92) 66%, var(--bg) 100%); }
  .cover .text { position: absolute; left: 64px; right: 64px; bottom: 150px; z-index: 2; }
  .cover .kicker { display: inline-block; font-size: 30px; font-weight: 700; color: var(--bg); background: var(--blue);
    padding: 8px 20px; border-radius: 8px; margin-bottom: 30px; }
  .cover h1 { font-size: 104px; line-height: 1.18; font-weight: 900; letter-spacing: -1px; }
  .cover h1 .hl { color: var(--blue); }
  .cover .sub { font-size: 36px; line-height: 1.5; color: #C9CDD4; margin-top: 30px; font-weight: 500; }

  /* ---------- 單字頁 ---------- */
  .word-slide .photo { position: absolute; top: 0; left: 0; right: 0; height: calc(var(--h) * .578); background-size: cover; }
  .word-slide .shade { position: absolute; top: 0; left: 0; right: 0; height: calc(var(--h) * .578 + 2px);
    background: linear-gradient(180deg, rgba(14,15,18,.6) 0%, rgba(14,15,18,0) 25%, rgba(14,15,18,0) 60%, var(--bg) 100%); }
  .word-slide .body { position: absolute; left: 64px; right: 64px; bottom: 150px; z-index: 2; }
  .quote { font-size: 120px; line-height: .6; font-weight: 900; color: var(--blue); font-family: Georgia, serif; height: 56px; }
  .line-en { font-size: 46px; line-height: 1.32; font-weight: 700; margin-top: 18px; }
  .line-en .hl { color: var(--bg); background: var(--blue); padding: 0 10px; border-radius: 8px;
    box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .line-zh { font-size: 34px; line-height: 1.5; color: var(--mute); margin-top: 16px; font-weight: 500; }
  .rule { height: 2px; background: var(--line); margin: 44px 0 40px; }
  .word-row { display: flex; align-items: baseline; gap: 22px; flex-wrap: wrap; }
  .word { font-size: 92px; font-weight: 900; letter-spacing: -2.5px; line-height: 1.05; }
  .ipa { font-size: 32px; color: var(--mute); font-weight: 500; }
  .def-row { display: flex; align-items: center; gap: 20px; margin-top: 26px; }
  .pos { font-size: 28px; font-weight: 700; color: var(--blue); border: 2px solid var(--blue); border-radius: 999px; padding: 4px 20px; flex: none; }
  .def { font-size: 44px; font-weight: 700; line-height: 1.3; }

  /* ---------- 9:16 安全區 ---------- */
  .tall .top { top: 150px; }
  .tall .foot { bottom: 300px; right: 180px; }
  .tall .cover .text, .tall .word-slide .body { bottom: 390px; right: 180px; }
  .tall .cta .center { padding-bottom: 200px; }

  /* ---------- CTA ---------- */
  .cta .photo { position: absolute; inset: -80px; background-size: cover; background-position: center;
    filter: blur(36px) brightness(.35) saturate(.8); }
  .cta .center { position: absolute; left: 64px; right: 64px; top: 0; bottom: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; z-index: 2; }
  .cta .icon { width: 220px; height: 220px; border-radius: 50px; box-shadow: 0 30px 70px rgba(78,175,244,.35); }
  .cta h2 { font-size: 80px; line-height: 1.25; font-weight: 900; margin-top: 64px; }
  .cta h2 .hl { color: var(--blue); }
  .cta .sub { font-size: 36px; line-height: 1.55; color: #C9CDD4; margin-top: 28px; font-weight: 500; }
  .cta .badges { display: flex; gap: 24px; margin-top: 64px; }
  .cta .badges img { height: 96px; }
  .cta .name { font-size: 30px; font-weight: 700; color: rgba(255,255,255,.75); margin-top: 30px; }
</style></head>
<body>
<script src="data.js"></script>
<script>
const D = window.DATA;
const qs = new URLSearchParams(location.search);
const i = +qs.get('i') || 0;
const H = +qs.get('h') || 1350;
document.documentElement.style.setProperty('--h', H + 'px');
// 9:16 會被 TikTok / Reels / Shorts 的介面蓋住：上方分頁列、右側按鈕、下方文案，所以內容往安全區內縮
if (H >= 1900) document.documentElement.classList.add('tall');
const total = D.words.length + 2;
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
// 文案語法：| 斷行、[文字] 標藍
const rich = s => esc(s).replace(/\[([^\]]+)\]/g, '<span class="hl">$1</span>').replace(/\|/g, '<br>');
// 例句標色：第一次出現的 match（不分大小寫）
const mark = (s, m) => {
  const k = s.toLowerCase().indexOf(m.toLowerCase());
  return k < 0 ? esc(s) : esc(s.slice(0, k)) + '<span class="hl">' + esc(s.slice(k, k + m.length)) + '</span>' + esc(s.slice(k + m.length));
};
const topBar = (l) => `<div class="top"><span>${esc(l)}</span><span class="num">${i + 1} / ${total}</span></div>`;
const foot = (r) => `<div class="foot"><span class="brand"><img src="icon.png">Nuances</span><span class="swipe zh">${r}</span></div>`;
const photo = (src, pos) => `<div class="photo" style="background-image:url(${src});background-position:${pos || 'center'}"></div>`;

let html;
if (i === 0) {
  const c = D.cover;
  html = `<div class="slide cover">${photo(c.image, c.focus || '50% 30%')}<div class="shade"></div>${topBar(D.show)}
    <div class="text zh">${c.kicker ? `<div class="kicker">${esc(c.kicker)}</div>` : ''}
      <h1>${rich(c.hook)}</h1>${c.sub ? `<div class="sub">${rich(c.sub)}</div>` : ''}</div>
    ${foot('往右滑 →')}</div>`;
} else if (i <= D.words.length) {
  const w = D.words[i - 1];
  html = `<div class="slide word-slide">${photo(w.image, w.focus)}<div class="shade"></div>
    ${topBar('WORD ' + String(i).padStart(2, '0'))}
    <div class="body"><div class="quote">“</div>
      <div class="line-en">${mark(w.sentence, w.match || w.word)}</div>
      <div class="line-zh zh">${esc(w.translation)}</div>
      <div class="rule"></div>
      <div class="word-row"><span class="word">${esc(w.word)}</span><span class="ipa">${esc(w.ipa || '')}</span></div>
      <div class="def-row zh">${w.pos ? `<span class="pos">${esc(w.pos)}</span>` : ''}<span class="def">${esc(w.definition)}</span></div>
    </div>${foot('→')}</div>`;
} else {
  const c = D.cta;
  html = `<div class="slide cta">${photo(D.cover.image)}${topBar('NUANCES')}
    <div class="center zh"><img class="icon" src="icon.png"><h2>${rich(c.headline)}</h2>
      ${c.sub ? `<div class="sub">${rich(c.sub)}</div>` : ''}
      <div class="badges"><img src="badge_appstore_zh-TW.png"><img src="badge_play_zh-TW.png"></div>
      <div class="name">${esc(c.name)}</div></div></div>`;
}
document.body.insertAdjacentHTML('beforeend', html);

// 字太多時逐步縮字，直到文字區不壓到頂部安全線
document.fonts.ready.then(() => {
  const box = document.querySelector('.cover .text, .word-slide .body');
  if (!box) return;
  const limit = H * (box.closest('.cover') ? .22 : .32);
  const shrink = [...box.querySelectorAll('h1, .sub, .line-en, .line-zh, .word, .def')];
  const base = shrink.map(el => parseFloat(getComputedStyle(el).fontSize));
  for (let s = 1; s > 0.6 && box.getBoundingClientRect().top < limit; s -= 0.04)
    shrink.forEach((el, k) => el.style.fontSize = base[k] * s + 'px');
});
</script>
</body></html>
