<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nuances 控制台</title>
<style>
:root{--bg:#0E0F12;--panel:#17191E;--panel2:#1E2127;--ink:#F5F6F8;--mute:#9BA1AB;--dim:#6B7079;--blue:#4EAFF4;--line:rgba(255,255,255,.08);
  --ok:#5DDB7F;--bad:#FF6B61;--warn:#FFB340}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,"PingFang TC",sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(14,15,18,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:1280px;margin:auto;padding:12px 16px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1{font-size:18px}
select,input,textarea,button{font:inherit;color:var(--ink)}
select,input[type=text],input[type=datetime-local],textarea{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
textarea{width:100%;min-height:140px;resize:vertical;font-size:13px;line-height:1.55}
button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--mute)}button.primary{background:var(--blue);border-color:var(--blue);color:#0E0F12;font-weight:700}
button.danger{color:var(--bad)}button.small{padding:3px 9px;font-size:13px}button:disabled{opacity:.4;cursor:default}
button.on{border-color:var(--blue);color:var(--blue)}
nav{display:flex;gap:2px;margin-left:18px;margin-right:auto;align-self:stretch}
nav a{padding:6px 14px 10px;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer;font-size:15px}
nav a.on{color:var(--ink);border-color:var(--blue);font-weight:600}
.tools{display:flex;gap:8px;align-items:center;padding-bottom:10px}
.badge{display:inline-block;min-width:18px;padding:0 6px;border-radius:99px;background:var(--blue);color:#0E0F12;font-size:11px;font-weight:700;text-align:center;margin-left:4px}
.badge.warn{background:var(--warn)}
main{max-width:1280px;margin:auto;padding:18px 16px 80px}
.hint{color:var(--mute);font-size:13px;margin-bottom:10px}
h2{font-size:13px;color:var(--mute);margin:22px 0 10px;font-weight:600;letter-spacing:.3px}h2:first-child{margin-top:0}
.warn-t{color:var(--warn)}
.empty{color:var(--mute);padding:20px;background:var(--panel);border-radius:14px;text-align:center}
/* 排程分頁：左邊待辦 + 日曆，右邊還沒排 */
.sched{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:24px;align-items:start}
aside{position:sticky;top:110px}
.next{display:flex;gap:16px;background:var(--panel);border:1px solid var(--blue);border-radius:14px;padding:12px;cursor:pointer}
.next img{width:112px;height:140px;object-fit:cover;border-radius:8px;flex:none;background:#000}
.when{color:var(--blue);font-weight:700;font-size:16px}.count{color:var(--ink);font-weight:600;margin-left:6px}
.todo{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:10px;margin-top:8px;cursor:pointer;font-size:13px}
.todo.manual{background:rgba(255,159,10,.14);color:var(--warn)}.todo.failed{background:rgba(255,69,58,.14);color:var(--bad)}
.todo b{color:var(--ink)}.todo .go{margin-left:auto;color:var(--mute);white-space:nowrap}
.store{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;margin-bottom:8px;cursor:grab}
.store:hover{border-color:var(--mute)}.store img{width:44px;height:55px;object-fit:cover;border-radius:6px;flex:none;background:#000}
.store .t{min-width:0}.store .name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.store .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 日曆 */
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}.calhead b{font-size:15px;min-width:130px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dow{color:var(--mute);font-size:12px;text-align:center}
.day{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:96px;padding:6px;display:flex;flex-direction:column;gap:4px}
.day.past{opacity:.5}.day.today{border-color:var(--blue)}.day.drop{background:var(--panel2);border-color:var(--blue)}
.day .n{font-size:12px;color:var(--mute)}.day.today .n{color:var(--blue);font-weight:700}
.ev{display:flex;gap:6px;align-items:center;background:var(--panel2);border-radius:6px;padding:3px;cursor:pointer;font-size:12px;border-left:3px solid var(--blue)}
.ev img{width:24px;height:30px;object-fit:cover;border-radius:4px;flex:none}.ev>span:not(.th){white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.posted{border-color:var(--ok)}.ev.failed{border-color:var(--bad)}.ev.manual{border-color:var(--warn)}
.ev[draggable=true]{cursor:grab}
.slot{border:1px dashed var(--dim);border-radius:6px;padding:3px 6px;font-size:12px;color:var(--dim)}
.slot.drop{border-color:var(--blue);color:var(--blue)}
/* 成效分頁 */
.cmps{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
.cmp{background:var(--panel);border-radius:14px;padding:12px 14px}.cmp h3{font-size:14px;margin-bottom:6px}
.crow{display:grid;grid-template-columns:minmax(80px,140px) 1fr 50px 40px;gap:8px;align-items:center;font-size:13px;padding:2px 0}
.cbar{height:8px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden}.cbar i{display:block;height:100%;background:var(--blue)}
.num{text-align:right;font-weight:700}
.prow{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;cursor:pointer}
.prow:hover{border-color:var(--mute)}.prow img{width:56px;height:70px;object-fit:cover;border-radius:6px;flex:none;background:#000}
/* 共用 */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:12px;padding:2px 10px;border-radius:99px;text-decoration:none;color:var(--ink);background:rgba(255,255,255,.08)}
.chip.posted{background:rgba(52,199,89,.18);color:var(--ok)}.chip.failed{background:rgba(255,69,58,.18);color:var(--bad)}
.chip.skipped{background:transparent;border:1px solid var(--line);color:var(--dim)}.chip.manual{background:rgba(255,159,10,.18);color:var(--warn)}
.chip.tag{background:transparent;border:1px solid var(--line);color:var(--mute)}
.pick-pf{display:inline-flex;align-items:center;gap:6px;cursor:pointer;padding:3px 10px 3px 6px;border-radius:99px;border:1px solid var(--line);font-size:12px;color:var(--mute);user-select:none;opacity:.45}
.pick-pf input{display:none}.pick-pf .pf{width:20px;height:20px;background:transparent}.pick-pf .pf i{width:12px;height:12px}
.pick-pf.on{opacity:1;border-color:var(--blue);color:var(--ink);background:rgba(78,175,244,.12)}.pick-pf.on .pf{--c:var(--blue)}
.pick-pf .dim{font-size:11px}
.chip.pick{cursor:pointer;border:1px solid var(--line);background:transparent}.chip.pick.on{background:var(--blue);color:#0E0F12;border-color:var(--blue);font-weight:700}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:8;align-items:flex-start;justify-content:center;overflow-y:auto;padding:40px 16px}
#modal.on{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(880px,100%);padding:20px;position:relative}
.sheet .x{position:absolute;top:12px;right:12px}
.cols{display:flex;gap:20px;flex-wrap:wrap}.cols>.media{flex:0 0 260px}.cols>.info{flex:1;min-width:280px}
.media video{width:260px;max-height:460px;border-radius:10px;background:#000}
.strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}.strip img{height:150px;border-radius:6px}
.media .strip img{height:auto;width:100%}.media .strip{flex-direction:column;max-height:520px;overflow-y:auto}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.err{color:var(--bad);font-size:12px;margin-top:6px;word-break:break-all}.note{color:var(--dim);font-size:12px;margin-top:4px}
.perf{font-size:13px;margin-top:6px}.dim{color:var(--dim)}.title{font-size:18px;font-weight:700}.sub{color:var(--mute);font-size:13px}
.kind{background:var(--panel2);border-radius:10px;padding:12px;margin-top:12px}
table{width:100%;border-collapse:collapse;background:var(--panel);border-radius:14px;overflow:hidden}
td,th{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--mute);font-weight:600}
.ok{color:var(--ok)}.no{color:var(--dim)}
pre{white-space:pre-wrap;background:var(--panel2);padding:10px;border-radius:8px;font-size:13px;margin-top:10px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:10px 16px;
  border-radius:10px;max-width:90vw;white-space:pre-wrap;display:none;z-index:9}
/* 平台圖示：圖示和底色是狀態色，右下角小徽章再標一次狀態 */
.pfs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pf{position:relative;width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none;
  background:rgba(255,255,255,.07);--c:var(--mute);text-decoration:none}
.pf i{width:14px;height:14px;background:var(--c);-webkit-mask:var(--ic) center/contain no-repeat;mask:var(--ic) center/contain no-repeat}
.pf b{color:var(--c);font-size:12px}
.pf.posted{background:rgba(52,199,89,.16);--c:var(--ok)}.pf.failed{background:rgba(255,69,58,.16);--c:var(--bad)}
.pf.manual{background:rgba(255,159,10,.16);--c:var(--warn)}.pf.skipped{opacity:.4}
.pf[data-b]::after{content:attr(data-b);position:absolute;right:-3px;bottom:-3px;width:13px;height:13px;border-radius:50%;
  background:var(--c);color:#0E0F12;font-size:9px;font-weight:800;line-height:13px;text-align:center;border:2px solid var(--panel)}
.pf.big{width:auto;border-radius:99px;padding:0 10px 0 8px;gap:6px;font-size:12px;color:var(--c)}
.legend{display:inline-flex;gap:12px;margin-left:12px;font-weight:400;font-size:12px}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
/* 影片 / 輪播：縮圖左下角只放圖示（紫＝影片、綠＝輪播） */
.th{position:relative;display:inline-block;flex:none;line-height:0}
.kd{position:absolute;left:4px;bottom:4px;display:inline-flex;align-items:center;gap:3px;padding:4px;border-radius:6px;
  font-size:11px;font-weight:700;line-height:1.3;color:#0E0F12;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.kd svg{width:12px;height:12px}.kd.reel{background:#B79CFF}.kd.carousel{background:#4ADE80}.kd span{display:none}
.kd.mini{left:2px;bottom:2px;padding:2px}.kd.mini svg{width:10px;height:10px}
.kt{display:inline-flex;align-items:center;gap:3px;font-weight:700}.kt svg{width:11px;height:11px}.kt.reel{color:#B79CFF}.kt.carousel{color:#4ADE80}
/* 使用者 / 數據分頁 */
.vhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.seg{display:inline-flex;background:var(--panel);border-radius:10px;padding:3px;gap:2px}
.seg a{padding:5px 12px;border-radius:8px;color:var(--mute);cursor:pointer;font-size:13px;white-space:nowrap}.seg a.on{background:var(--panel2);color:var(--ink);font-weight:600}
.fresh{margin-left:auto;color:var(--dim);font-size:12px;display:inline-flex;gap:6px;align-items:center}.fresh .spin{width:9px;height:9px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}@media(max-width:800px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--panel);border:1px solid transparent;border-radius:14px;padding:12px 14px;cursor:pointer;min-width:0}
.kpi:hover{border-color:var(--line)}.kpi.on{border-color:var(--blue)}
.kpi .k{color:var(--mute);font-size:12px}.kpi .v{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .s{color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl{font-size:12px;font-weight:600;margin-left:6px}.dl.up{color:var(--ok)}.dl.down{color:var(--bad)}.dl.flat{color:var(--dim)}
.spark{width:100%;height:28px;display:block;margin-top:6px}.spark path{fill:none;stroke:var(--c,var(--blue));stroke-width:1.5}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
.card{background:var(--panel);border-radius:14px;padding:12px 14px;min-width:0}.card h3{font-size:14px;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
.card h3 .dim{font-weight:400;font-size:12px}
.big{margin-top:10px}.big .chart{height:180px}
.chart{width:100%;height:120px;display:block}.chart rect.b{fill:var(--c,var(--blue))}.chart rect.h{fill:transparent}
.chart g:hover rect.b{opacity:.7}.chart g.hit{cursor:pointer}.chart g.hit:hover rect.h{fill:rgba(255,255,255,.05)}
.hb.click{cursor:pointer;border-radius:6px;margin:0 -6px;padding:2px 6px}.hb.click:hover{background:var(--panel2)}
.dnav{display:flex;align-items:center;gap:8px;margin-top:4px}
.xl{display:flex;justify-content:space-between;color:var(--dim);font-size:11px;margin-top:4px;font-variant-numeric:tabular-nums}
.insight{color:var(--mute);font-size:13px;margin-top:10px}
.hb{display:grid;grid-template-columns:minmax(70px,120px) 1fr 70px;gap:8px;align-items:center;font-size:13px;padding:2px 0}
.hb .cbar i{background:var(--c,var(--blue))}.hb .num{font-variant-numeric:tabular-nums}
.funnel .hb{grid-template-columns:minmax(90px,130px) 1fr 40px 86px}
.ufilter{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.ufilter input[type=text]{flex:1;min-width:180px}
.tscroll{overflow-x:auto;border-radius:14px}
.users td,.users th{white-space:nowrap;font-size:13px;padding:9px 12px}.users tr.r{cursor:pointer}.users tr.r:hover td{background:var(--panel2)}
.users td.em{max-width:340px;overflow:hidden;text-overflow:ellipsis}.users .n{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;background:rgba(255,255,255,.08);color:var(--mute)}
.tag.paid{background:rgba(93,219,127,.18);color:var(--ok)}.tag.gift{background:rgba(78,175,244,.16);color:var(--blue)}.tag.warn{background:rgba(255,179,64,.16);color:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}@media(max-width:700px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stats div{background:var(--panel2);border-radius:10px;padding:8px 10px}.stats b{display:block;font-size:16px}.stats span{color:var(--mute);font-size:12px}
details.more{background:var(--panel2);border-radius:10px;margin-top:8px}details.more summary{cursor:pointer;padding:9px 12px;font-weight:600;font-size:13px;list-style:none}
details.more summary::before{content:'▸ ';color:var(--dim)}details.more[open] summary::before{content:'▾ '}
details.more table{background:transparent}
.list{max-height:300px;overflow-y:auto;border-top:1px solid var(--line)}
.list div{display:flex;gap:10px;padding:6px 12px;font-size:13px;border-bottom:1px solid var(--line)}.list div:last-child{border:0}
.list .t{color:var(--dim);flex:none;font-variant-numeric:tabular-nums}.list .w{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .lv-error{color:var(--bad)}.list .lv-warn{color:var(--warn)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:700px){.two{grid-template-columns:1fr}}
/* 動畫 */
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
@keyframes slideL{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.anim>*{animation:rise .32s cubic-bezier(.2,.7,.2,1) both}
.anim>*:nth-child(2){animation-delay:.04s}.anim>*:nth-child(3){animation-delay:.08s}
.anim .sched>*:nth-child(2){animation:rise .32s .1s cubic-bezier(.2,.7,.2,1) both}
.anim .store,.anim .prow,.anim .todo{animation:rise .3s cubic-bezier(.2,.7,.2,1) both}
.cal.nextpg{animation:slideL .28s ease-out}.cal.prevpg{animation:slideR .28s ease-out}
#modal.opening{animation:fade .18s ease-out}#modal.opening .sheet{animation:pop .24s cubic-bezier(.2,.8,.2,1)}
#toast.show{animation:rise .22s ease-out}
.next,.store,.prow,.ev,.todo,.slot,.day,.chip.pick,button,nav a{transition:transform .15s ease,border-color .15s ease,background-color .15s ease,color .15s ease,box-shadow .15s ease}
.next:hover,.store:hover,.prow:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.35)}
.ev:hover,.todo:hover{transform:translateX(2px)}
button:active{transform:scale(.96)}
button.ghost{background:transparent;border-color:transparent;color:var(--dim)}button.ghost:hover{color:var(--mute)}
/* 背景工作：按了畫面先變，右上角顯示還在處理的 */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{opacity:.45}}
@keyframes shimmer{from{background-position:100% 0}to{background-position:-100% 0}}
.spin{display:inline-block;width:11px;height:11px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-1px}
.busy{animation:breathe 1.3s ease-in-out infinite}
.store.busy,.next.busy,.ev.busy,.prow.busy{border-style:dashed}
.sk{border-radius:12px;background:linear-gradient(90deg,var(--panel) 30%,var(--panel2) 50%,var(--panel) 70%);background-size:200% 100%;animation:shimmer 1.3s linear infinite}
#sync{min-width:92px}#sync.run{color:var(--blue);border-color:var(--blue)}#sync.bad{color:var(--bad);border-color:var(--bad)}#sync.idle{color:var(--dim)}
#tray{position:fixed;top:56px;right:16px;width:min(340px,calc(100vw - 32px));max-height:60vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:6px;z-index:7;display:none;box-shadow:0 10px 30px rgba(0,0,0,.45)}
#tray.on{display:block;animation:rise .18s ease-out}
.task{display:flex;gap:10px;align-items:flex-start;padding:8px;border-radius:8px;font-size:13px}.task+.task{border-top:1px solid var(--line)}
.task>span:first-child{width:14px;flex:none;text-align:center}.task .sub{white-space:pre-wrap;word-break:break-all}
.task.error b{color:var(--bad)}
/* 拖排好的貼文時，右邊「還沒排」變成放回去的地方 */
body.dragging-item aside{outline:2px dashed var(--dim);outline-offset:6px;border-radius:12px}
body.dragging-item aside::before{content:'放這裡＝取消排程';display:block;text-align:center;color:var(--blue);font-weight:600;padding:10px;margin-bottom:8px;border-radius:10px;background:rgba(78,175,244,.12)}
aside.drop{outline-color:var(--blue)!important;background:rgba(78,175,244,.06)}
h2 .when{font-size:16px}h2 .count{font-size:14px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:900px){.sched{grid-template-columns:1fr}aside{position:static}}
@media(max-width:700px){nav{margin-left:0;order:3;width:100%}.day{min-height:64px}.ev>span:not(.th){display:none}.legend,#mode{display:none}
  .slot{font-size:0;height:14px;padding:0}
  .next img{width:84px;height:105px}}
</style></head><body>
<header>
  <div class="bar"><h1>Nuances 控制台</h1>
    <nav id="tabs"></nav>
    <div class="tools"><span class="sub" id="mode"></span>
      <select id="chan" title="國家"></select>
      <button class="small" id="sync" onclick="toggleTray(event)" title="背景處理中的工作"></button>
      <button class="small" id="refresh" onclick="if(tab==='users'||tab==='data')loadApp(tab,true);load()">重新整理</button>
      <button class="small" id="gear" onclick="go(tab==='settings'?'schedule':'settings')" title="帳號與設定">⚙ 設定</button></div>
  </div>
</header>
<main id="main"></main>
<div id="tray"></div>
<div id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<script>
let S = null, tab = localStorage.getItem('tab2') || 'schedule', cal = null, modalFor = null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const HOOK = {reel:'劇情懸念', carousel:'英文怎麼說'};   // 開頭類型只是比成效用的標籤，照類型自動帶
const ST = {posted:'已發', queued:'排隊', skipped:'略過', failed:'失敗', manual:'待手動'};
const LBL = {hook:'開頭留人', keep:'收藏分享', follow:'轉追蹤'};
const WD = ['日','一','二','三','四','五','六'];

function toast(m){ const t=$('#toast'); t.textContent=m; t.style.display=m?'block':'none'; t.classList.remove('show'); void t.offsetWidth; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none', 4500); }
// ---------- 背景工作 ----------
// 按下去先改畫面（optimistic），伺服器在背景照順序做；全部做完才重新讀一次雲端資料，失敗的會被讀回來的資料蓋回去
const TASKS = [];
const TLBL = {add:'排進發文（上傳中）', caption:'儲存文案', time:'改時間', move:'換順序', 'item-platforms':'改這篇的平台', skip:'跳過',
  retry:'重發', done:'標記已發', delete:'刪除', 'post-now':'立刻發', slots:'改發文時段', platforms:'改發文平台', reschedule:'重新排時段',
  check:'檢查帳號', ignore:'移出收件匣', unignore:'還原收件匣', cover:'換封面'};
const pending = () => TASKS.filter(t => t.status === 'pending' || t.status === 'running');
// 只標被改到的那一篇：排程上的貼文用 id，收件匣（還沒有 id）用資料夾
const busy = i => pending().some(t => t.targets.includes(i.id || i.folder));
const targetsOf = (action, b) => action === 'add' ? b.kinds.map(k => `${b.channel}-${(b.folder.match(/([^/]+)\/(\d+)-[^/]*$/) || []).slice(1).join('-')}-${k}`)
  : b.id ? [b.id] : action === 'ignore' ? [b.folder] : [];
let lastTask = 0;
function api(action, body, quiet){
  const t = {action, label: TLBL[action] || action, status: 'pending', message: '', targets: targetsOf(action, body), quiet, t0: Date.now()};
  const done = new Promise(r => t.resolve = r);
  TASKS.unshift(t); lastTask = t.t0;
  if(optimistic(action, body)) rerender();
  renderTray();
  fetch('/api/'+action, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)})
    .then(r => r.json()).then(j => {
      if(!j.ok) throw new Error(j.message);
      if(!j.task){ t.status = 'done'; t.message = j.message || ''; return finish(t); }   // 舊版伺服器：做完才回，沒有任務編號
      t.sid = j.task; poll(); })
    .catch(e => { t.status = 'error'; t.message = e.message || String(e); finish(t); });
  return done;
}
let polling = false;
async function poll(){
  if(polling) return; polling = true;
  while(TASKS.some(t => t.sid && ['pending','running'].includes(t.status))){
    await new Promise(r => setTimeout(r, 500));
    try{
      const all = await (await fetch('/api/tasks')).json();
      for(const t of TASKS){
        if(!t.sid || !['pending','running'].includes(t.status)) continue;
        const s = all[t.sid] || {status: 'error', message: '控制台重開過，這個工作沒做完'};
        t.status = s.status; t.message = s.message;
        if(['done','error'].includes(s.status)) finish(t);
      }
    }catch(e){}
    renderTray();
  }
  polling = false;
}
function finish(t){
  t.t1 = Date.now(); renderTray();
  if(t.status === 'error') toast(`✗ ${t.label}失敗：${t.message}`);
  else if(!t.quiet && t.message) toast(t.message);
  t.resolve(t);
  if(!pending().length) load(true);   // 全部做完才讀回雲端，避免把還沒做完的改動蓋掉
}
const secs = t => Math.max(1, Math.round(((t.t1 || Date.now()) - t.t0) / 1000)) + ' 秒';
function renderTray(){
  const n = pending().length, bad = TASKS.some(t => t.status === 'error' && !t.seen), s = $('#sync');
  s.className = 'small ' + (n ? 'run' : bad ? 'bad' : 'idle');
  s.innerHTML = n ? `<span class="spin"></span> 處理中 ${n}` : bad ? '⚠ 有失敗' : '✓ 已同步';
  const ic = {pending:'<span class="dim">⋯</span>', running:'<span class="spin" style="color:var(--blue)"></span>', done:'<span class="ok">✓</span>', error:'<span style="color:var(--bad)">✗</span>'};
  $('#tray').innerHTML = TASKS.length ? TASKS.slice(0, 10).map(t => `<div class="task ${t.status}">${ic[t.status]}<div style="min-width:0">
      <b>${esc(t.label)}</b> <span class="dim">${t.status==='pending' ? '排隊中' : t.status==='running' ? '處理中 ' + secs(t) : secs(t)}</span>
      ${t.message ? `<div class="sub">${esc(t.message)}</div>` : ''}</div></div>`).join('')
    : '<div class="task dim">還沒有操作</div>';
}
function toggleTray(e){
  e.stopPropagation(); const tr = $('#tray'); tr.classList.toggle('on');
  if(tr.classList.contains('on')){ TASKS.forEach(t => t.seen = true); renderTray(); }
}
document.addEventListener('click', e => { if(!e.target.closest('#tray')) $('#tray').classList.remove('on'); });

// 先改畫面：回傳 true 代表畫面要重畫
function optimistic(a, b){
  if(!S) return false;
  const i = b.id && S.items.find(x => x.id === b.id);
  const setWhen = (it, at) => { it.when_iso = at; it.when_abs = at + ':00' + it.when_abs.slice(19); it.when = at.slice(5,10).replace('-','/') + ' ' + at.slice(11,16); };
  const blank = n => ({name: n, label: (S.all_platforms.find(p => p.name === n) || {}).label || n, status: 'queued', url: '', error: '', note: '',
    manual: !!(S.all_platforms.find(p => p.name === n) || {}).manual, scores: {}, snapshot: '', ratio: null, as: '', media: [], caption: ''});
  const sort = () => S.items.sort((x, y) => x.when_abs.localeCompare(y.when_abs));
  switch(a){
    case 'time': if(!i) return false; setWhen(i, b.at); S.free = S.free.filter(s => s !== b.at); sort(); return true;
    case 'move': { const q = queuedList(), k = q.indexOf(i), o = q[k + b.dir]; if(!o) return false;
      [i.when_abs, o.when_abs, i.when_iso, o.when_iso, i.when, o.when] = [o.when_abs, i.when_abs, o.when_iso, i.when_iso, o.when, i.when]; sort(); return true; }
    case 'caption': if(i) i.caption = b.text.trim(); return !!i;
    case 'skip': if(i) i.state = 'skipped'; return !!i;
    case 'delete': { if(!i) return false;
      S.items = S.items.filter(x => x !== i);
      // 先放回「還沒排」，預覽影片等讀回雲端資料再補
      let f = S.inbox.find(f => f.folder === i.folder);
      if(!f) S.inbox.push(f = {folder: i.folder, day: '', topic: i.topic, show: i.tags.show || '', format: i.tags.format || '', kinds: [], has_cards: false});
      f.kinds.push(i.kind === 'reel'
        ? {kind: 'reel', kind_zh: '影片', video: true, preview: '', poster: i.thumb, caption: i.caption, caption_file: 'caption-reel.txt'}
        : {kind: 'carousel', kind_zh: `輪播 ${i.count} 張`, video: false, poster: i.thumb, slides: Array(i.count).fill(i.thumb), extras: [], caption: i.caption, caption_file: 'caption.txt'});
      return true; }
    case 'ignore': S.inbox = S.inbox.filter(f => f.folder !== b.folder); return true;
    case 'item-platforms': if(!i) return false;
      i.platforms = [...i.platforms.filter(p => b.list.includes(p.name) || p.status !== 'queued'), ...b.list.filter(n => !i.platforms.some(p => p.name === n)).map(blank)];
      i.platforms.forEach(p => { if(b.list.includes(p.name) && p.status === 'skipped'){ p.status = 'queued'; p.note = ''; } });
      return true;
    case 'retry': if(!i) return false;
      i.platforms.forEach(p => { if((!b.platform || p.name === b.platform) && p.status !== 'posted'){ p.status = 'queued'; p.error = p.note = ''; } });
      if(i.state === 'skipped' || i.state === 'failed') i.state = 'queued'; return true;
    case 'done': { const p = i && i.platforms.find(p => p.name === b.platform); if(!p) return false; p.status = 'posted'; p.url = b.url || p.url; return true; }
    case 'slots': S.chan.slots = b.slots.split(',').map(s => s.trim()).filter(Boolean).sort(); return true;
    case 'platforms': S.chan.platforms[b.kind] = b.list; return true;
    case 'add': {
      const f = S.inbox.find(f => f.folder === b.folder); if(!f) return false;
      const [, cat, no] = b.folder.match(/([^/]+)\/(\d+)-[^/]*$/) || [];
      const off = (S.items[0] && S.items[0].when_abs.slice(19)) || '+08:00';
      for(const kind of b.kinds){
        const k = f.kinds.find(x => x.kind === kind); if(!k) continue;
        f.kinds = f.kinds.filter(x => x !== k);
        const it = {id: `${b.channel}-${cat}-${no}-${kind}`, channel: b.channel, topic: f.topic, kind, kind_zh: KNAME[kind], count: k.slides ? k.slides.length : 1,
          folder: b.folder, tags: {hook: b.hook_reel || b.hook_carousel || '', show: b.show || '', format: f.format}, state: 'queued',
          when_abs: b.at + ':00' + off, caption: b.captions[kind] || '', thumb: k.poster, platforms: (b.platforms[kind] || []).map(blank), rating: '', job: ''};
        setWhen(it, b.at); S.items.push(it);
      }
      S.inbox = S.inbox.filter(f => f.kinds.length); S.free = S.free.filter(s => s !== b.at); sort(); return true;
    }
  }
  return false;
}
function rerender(){ render(); if(modalFor) openModal(...modalFor); }

// 第一次打開、換國家時的骨架畫面
function skeleton(){
  const b = (h, st='') => `<div class="sk" style="height:${h}px;${st}"></div>`;
  $('#main').innerHTML = `<div class="sched"><div><h2>下一篇</h2>${b(166)}<h2>日曆</h2>${b(28,'width:240px;margin-bottom:10px')}
    <div class="cal">${Array(28).fill(b(96)).join('')}</div></div>
    <aside><h2>還沒排</h2>${Array(5).fill(b(69,'margin-bottom:8px')).join('')}</aside></div>`;
}
async function load(silent){
  const c = $('#chan').value || localStorage.getItem('chan') || '', t0 = Date.now(), btn = $('#refresh');
  if(!S || c !== S.channel) skeleton();
  btn.innerHTML = '<span class="spin"></span> 讀取中'; btn.disabled = true;
  try{
    const r = await fetch('/api/state?channel=' + encodeURIComponent(c)), j = await r.json();
    if(!r.ok) throw new Error(j.error || r.status);
    if(lastTask > t0 && pending().length) return;   // 讀的途中又按了別的，等那個做完會再讀
    S = j;
  }catch(e){
    toast('讀不到資料：' + (e.message || e) + '（控制台還開著嗎？）');
    if(!S) $('#main').innerHTML = `<div class="empty">讀不到資料，<a href="#" onclick="load();return false" style="color:var(--blue)">再試一次</a></div>`;
    return;
  }finally{ btn.innerHTML = '重新整理'; btn.disabled = false; }
  localStorage.setItem('chan', S.channel);
  $('#chan').innerHTML = Object.entries(S.channels).map(([k,v]) => `<option value="${k}" ${k===S.channel?'selected':''}>${esc(v)}（${k}）</option>`).join('');
  $('#mode').textContent = (S.cloud ? '雲端資料' : '⚠ 本機測試資料') + ' · ' + S.now;
  rerender();   // 操作後刷新開著的詳細頁
}
$('#chan').onchange = () => load();
const queuedList = () => S.items.filter(i => ['queued','partial'].includes(i.state));
const manualList = () => S.items.filter(i => i.platforms.some(p => p.status === 'manual'));
const failedList = () => S.items.filter(i => i.platforms.some(p => p.status === 'failed'));
const doneList = () => S.items.filter(i => !['queued','partial'].includes(i.state)).reverse();

function render(){
  if(!S && tab !== 'users' && tab !== 'data') return;   // 排程資料還沒讀到；使用者 / 數據分頁不用它
  const todo = S ? manualList().length + failedList().length : 0;
  const tabs = [['schedule','排程',todo,'warn'],['stats','成效',0,''],['users','使用者',0,''],['data','數據',0,'']];
  $('#tabs').innerHTML = tabs.map(([k,l,n,c]) => `<a class="${k===tab?'on':''}" onclick="go('${k}')">${l}${n?`<span class="badge ${c}">${n}</span>`:''}</a>`).join('');
  $('#gear').classList.toggle('on', tab === 'settings');
  $('#main').innerHTML = ({schedule: scheduleView, stats: statsView, settings: settingsView, users: usersView, data: dataView}[tab] || scheduleView)();
  if(tab === 'users') drawUsers();
  $('#main').classList.toggle('anim', tab !== shown); shown = tab;
}
let shown = null;
function go(t){ tab = t; localStorage.setItem('tab2', t); render(); }

// ---------- 共用 ----------
// simple-icons 的平台標誌（用 mask 套狀態色）；沒有標誌的用字母
const LOGO = {instagram:'instagram', threads:'threads', facebook:'facebook', tiktok:'tiktok', youtube:'youtube', xiaohongshu:'xiaohongshu',
  douyin:'tiktok', bilibili:'bilibili', line_voom:'line', naver_blog:'naver', x:'x'};
const KSVG = {reel:'<svg viewBox="0 0 16 16"><path d="M4 2.5v11l9.5-5.5z" fill="currentColor"/></svg>',
  carousel:'<svg viewBox="0 0 16 16"><rect x="5.5" y=".5" width="9.5" height="11" rx="1.5" fill="currentColor" opacity=".45"/><rect x="3.5" y="2.5" width="9.5" height="11" rx="1.5" fill="currentColor" opacity=".7"/><rect x="1.5" y="4.5" width="9.5" height="11" rx="1.5" fill="currentColor"/></svg>'};
const KNAME = {reel:'影片', carousel:'輪播'};
// 縮圖 + 左下角類型標記；mini 是小縮圖（只放圖示）
function th(src, kind, mini){
  return `<span class="th"><img src="${esc(src)}" loading="lazy"><span class="kd ${kind} ${mini?'mini':''}" title="${KNAME[kind]}">${KSVG[kind]}<span>${KNAME[kind]}</span></span></span>`;
}
// 文字裡的類型（圖示 + 字，同色）
const kt = (kind, extra='') => `<span class="kt ${kind}">${KSVG[kind]}${KNAME[kind]}${extra}</span>`;
const BADGE = {posted:'✓', failed:'!', manual:'✎', skipped:'–', queued:''};
function pf(p, big){
  const logo = LOGO[p.name] ? `<i style="--ic:url(https://cdn.jsdelivr.net/npm/simple-icons@13.21.0/icons/${LOGO[p.name]}.svg)"></i>` : `<b>${esc(p.label[0])}</b>`;
  const tag = p.url ? 'a' : 'span', href = p.url ? ` href="${esc(p.url)}" target="_blank" onclick="event.stopPropagation()"` : '';
  return `<${tag} class="pf ${p.status} ${big?'big':''}" title="${esc(p.label)}${p.as?'（'+p.as+'）':''} · ${ST[p.status]}"${href}${BADGE[p.status]&&!big?` data-b="${BADGE[p.status]}"`:''}>${logo}${big?esc(p.label)+(p.as?'（'+p.as+'）':'')+' · '+ST[p.status]:''}</${tag}>`;
}
// 還沒發的貼文：略過的平台不算要發，縮圖旁和詳細頁的勾選都只看這些
const active = i => ['queued','partial'].includes(i.state) ? i.platforms.filter(p => p.status !== 'skipped') : i.platforms;
function chips(i){ return `<div class="pfs">${active(i).map(p => pf(p)).join('')}</div>`; }
// 排好的貼文可以拖：拖到別天改時間，拖回右邊「還沒排」取消排程
const dragItem = i => i.state === 'queued' ? `draggable="true" ondragstart="dragStart(event,'item:${i.id}')" ondragend="dragEnd()"` : '';
function dragStart(e, v){ e.dataTransfer.setData('text', v); if(v.startsWith('item:')) document.body.classList.add('dragging-item'); }
function dragEnd(){ document.body.classList.remove('dragging-item'); document.querySelectorAll('.drop').forEach(x => x.classList.remove('drop')); }
function dropBack(e){
  e.preventDefault(); dragEnd();
  const [type, id] = e.dataTransfer.getData('text').split(':');
  if(type === 'item'){ toast('已取消排程，回到「還沒排」'); api('delete', {id}, true); }
}
const LEGEND = `<span class="legend"><span><i style="background:var(--mute)"></i>排隊</span><span><i style="background:var(--ok)"></i>已發</span>
  <span><i style="background:var(--warn)"></i>待手動</span><span><i style="background:var(--bad)"></i>失敗</span></span>`;
function countdown(iso){
  const d = new Date(iso) - Date.now(); if(d <= 0) return '時間到了，等雲端發';
  const day = Math.floor(d/864e5), h = Math.floor(d%864e5/36e5), m = Math.floor(d%36e5/6e4);
  return (day ? day+' 天 ' : '') + (h ? h+' 小時 ' : '') + (day ? '' : m+' 分') + '後';
}
function dayWord(iso){
  const d = new Date(iso.slice(0,10)+'T00:00'), t = new Date(); t.setHours(0,0,0,0);
  const n = Math.round((d - t) / 864e5), md = `${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）`;
  return (n === 0 ? '今天 ' : n === 1 ? '明天 ' : n === 2 ? '後天 ' : '') + md + ' ' + iso.slice(11,16);
}

// ---------- 排程分頁：待辦 + 日曆 + 還沒排 ----------
function scheduleView(){
  const q = queuedList(), nx = q[0];
  const next = nx ? `<div class="next ${busy(nx)?'busy':''}" ${dragItem(nx)} onclick="openModal('item','${nx.id}')">${th(nx.thumb, nx.kind)}
      <div><div class="title">${esc(nx.topic)}</div>
        <div class="sub">${kt(nx.kind, nx.kind==='carousel'?' '+nx.count+' 張':'')}${nx.tags.hook?' · '+esc(nx.tags.hook):''}</div>
        ${chips(nx)}</div></div>`
    : `<div class="empty">排程是空的</div>`;
  const todos = manualList().map(i => `<div class="todo manual" onclick="openModal('item','${i.id}')">⚠ <span><b>${esc(i.topic)}</b> · 手動發 ${i.platforms.filter(p=>p.status==='manual').map(p=>esc(p.label)).join('、')}</span><span class="go">›</span></div>`)
    .concat(failedList().map(i => `<div class="todo failed" onclick="openModal('item','${i.id}')">✗ <span><b>${esc(i.topic)}</b> · 失敗 ${i.platforms.filter(p=>p.status==='failed').map(p=>esc(p.label)).join('、')}</span><span class="go">›</span></div>`)).join('');
  return `<div class="sched"><div>
      <h2>${nx ? `<span class="when">${esc(dayWord(nx.when_iso))}</span><span class="count">· ${countdown(nx.when_abs)}</span>` : '下一篇'} ${LEGEND}</h2>${next}${todos}
      <h2>日曆</h2>${calView()}
    </div><aside ondragover="if(document.body.classList.contains('dragging-item')){event.preventDefault();this.classList.add('drop')}"
      ondragleave="if(!this.contains(event.relatedTarget))this.classList.remove('drop')" ondrop="dropBack(event)">${storeView()}</aside></div>`;
}

function storeView(){
  // 還沒排的成品，影片和輪播分兩區
  const part = kind => S.inbox.flatMap((f, fi) => f.kinds.map((k, ki) => k.kind !== kind ? '' : `<div class="store ${busy(f)?'busy':''}" draggable="true"
      ondragstart="dragStart(event,'inbox:${fi}:${ki}')" ondragend="dragEnd()" onclick="openModal('inbox',${fi},${ki})">
      ${th(k.poster, k.kind, true)}<div class="t"><div class="name">${esc(f.topic)}</div>
      <div class="sub">${kind==='carousel'?k.slides.length+' 張':esc(f.format)}${k.caption?'':' <span class="warn-t" title="還沒寫文案">● 沒文案</span>'}</div></div></div>`)).filter(Boolean);
  return ['reel','carousel'].map(kind => { const rows = part(kind);
      return `<h2>${kt(kind)} 還沒排 ${rows.length}</h2>${rows.length ? rows.join('') : `<div class="empty">沒有新的${KNAME[kind]}</div>`}`; }).join('')
    + `<div class="row"><button class="small ghost" onclick="api('unignore',{})">還原被移除的</button></div>`;
}

const pad = n => String(n).padStart(2,'0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function calView(){
  // 從這週日開始連看 4 週，‹ › 一次跳 4 週
  const today = new Date(); today.setHours(0,0,0,0);
  if(!cal){ cal = new Date(today); cal.setDate(today.getDate() - today.getDay()); }
  const byDay = {}, free = {};
  for(const i of S.items){ if(i.state === 'skipped') continue; (byDay[i.when_abs.slice(0,10)] ||= []).push(i); }
  for(const s of S.free) (free[s.slice(0,10)] ||= []).push(s);
  const end = new Date(cal); end.setDate(cal.getDate() + 27);
  let cells = '';
  for(let k=0; k<28; k++){
    const d = new Date(cal); d.setDate(cal.getDate()+k);
    const key = keyOf(d);
    const evs = (byDay[key]||[]).sort((a,b)=>a.when_abs.localeCompare(b.when_abs)).map(i => {
      const st = i.platforms.some(p=>p.status==='manual') ? 'manual' : i.platforms.some(p=>p.status==='failed') ? 'failed' : i.state==='posted' ? 'posted' : i.state;
      return `<div class="ev ${st} ${busy(i)?'busy':''}" ${dragItem(i)} onclick="openModal('item','${i.id}')" title="${esc(i.topic)}">
        ${th(i.thumb, i.kind, true)}<span>${esc(i.when_abs.slice(11,16))} ${esc(i.topic)}</span></div>`; }).join('');
    const slots = (free[key]||[]).map(s => `<div class="slot" title="空的時段：把成品拖到這裡" ondragover="event.preventDefault();this.classList.add('drop')"
        ondragleave="this.classList.remove('drop')" ondrop="event.stopPropagation();dropOn(event,'${s}')">${s.slice(11)}</div>`).join('');
    cells += `<div class="day ${d<today?'past':''} ${+d===+today?'today':''}"
      ondragover="event.preventDefault();this.classList.add('drop')" ondragleave="this.classList.remove('drop')" ondrop="dropOn(event,'${key}')">
      <div class="n">${d.getDate()===1||k===0?(d.getMonth()+1)+'/':''}${d.getDate()}</div>${evs}${slots}</div>`;
  }
  return `<div class="calhead"><button class="small" onclick="calMove(-1)">‹</button><b>${cal.getMonth()+1}/${cal.getDate()} – ${end.getMonth()+1}/${end.getDate()}</b>

</div>
    <div class="cal">${WD.map(x=>`<div class="dow">${x}</div>`).join('')}${cells}</div>`;
}
function calMove(n){ cal.setDate(cal.getDate() + 28*n); render(); $('.cal').classList.add(n > 0 ? 'nextpg' : 'prevpg'); }
function dropOn(ev, at){
  // at 是空時段（YYYY-MM-DDTHH:MM）或某一天（YYYY-MM-DD，用那天第一個空時段，沒有就用原本的時間）
  ev.preventDefault(); document.querySelectorAll('.drop').forEach(x=>x.classList.remove('drop'));
  const [type, a, b] = ev.dataTransfer.getData('text').split(':');
  const slotOf = keep => at.length > 10 ? at : (S.free.find(s => s.startsWith(at)) || at + 'T' + (keep || S.chan.slots[0]));
  if(type === 'item'){ const i = S.items.find(x=>x.id===a); if(i) api('time', {id: a, at: slotOf(i.when_abs.slice(11,16))}); }
  if(type === 'inbox') openModal('inbox', +a, +b, slotOf());   // 先確認文案和 hook 再排
}

const pct = (a, b) => b ? Math.round(a / b * 100) + '%' : '—';
function delta(now, prev){
  if(!prev) return now ? '<span class="dl up">新</span>' : '';

}
function spark(vals, color){
  const max = Math.max(1, ...vals), W = 100, H = 28;
  const d = vals.map((v, i) => `${i ? 'L' : 'M'}${(i / (vals.length - 1) * W).toFixed(1)},${(H - 2 - v / max * (H - 4)).toFixed(1)}`).join('');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="--c:${color}"><path d="${d}" vector-effect="non-scaling-stroke"/></svg>`;
}
// 直條圖：每一天一根，滑上去看數字
// drill 有給就能點：整根欄位（含上方空白）都是點擊區，點了開那一天的第二層
function bars(rows, key, color, fmt = v => v, drillKey){
  const W = 600, H = 104, max = Math.max(1, ...rows.map(r => r[key])), w = W / rows.length;
  const cols = rows.map((r, i) => { const h = Math.max(Math.round(H * r[key] / max), r[key] ? 2 : 0), x = (i * w + 1).toFixed(1), bw = (w - 2).toFixed(1);
    const bar = `<rect class="b" x="${x}" y="${H - h}" width="${bw}" height="${h}" rx="2"></rect>`, tip = `<title>${r.d}：${fmt(r[key])}${drillKey ? '（點了看明細）' : ''}</title>`;
    return drillKey && r.iso ? `<g class="hit" onclick="drill('day:${drillKey}:${r.iso}')"><rect class="h" x="${x}" y="0" width="${bw}" height="${H}"></rect>${bar}${tip}</g>` : `<g>${bar}${tip}</g>`; }).join('');
  const lab = [0, Math.floor(rows.length / 2), rows.length - 1].map(i => `<span>${rows[i].d}</span>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="--c:${color}">${cols}</svg><div class="xl">${lab}</div>`;
}
function hbars(obj, group, color){
  const rows = Object.entries(obj || {}).sort((a, b) => b[1] - a[1]), tot = rows.reduce((s, r) => s + r[1], 0), max = Math.max(1, ...rows.map(r => r[1]));
  const can = SEG.includes(group);
  return rows.map(([k, n]) => `<div class="hb ${can ? 'click' : ''}" style="--c:${color}" ${can ? `onclick="drill('seg:${group}:${esc(k)}')" title="點了看是哪些人"` : ''}><span title="${esc(k)}">${esc(nm(group, k))}</span><span class="cbar"><i style="width:${n / max * 100}%"></i></span><span class="num">${n}<span class="dim" style="font-weight:400"> ${pct(n, tot)}</span></span></div>`).join('') || '<div class="dim">沒有資料</div>';
}

    <div class="ufilter">${FILTERS.map(([k, l, f]) => `<span class="chip pick ${UF.plan === k ? 'on' : ''}" onclick="UF.plan='${k}';saveUF();render()">${l} ${u.filter(f).length}</span>`).join('')}</div>
    <div class="tscroll"><table class="users"><thead><tr><th>Email</th><th>方案</th><th>最後活躍</th><th class="n">卡片</th></tr></thead><tbody id="ulist"></tbody></table></div>`;
}
function planTag(x){
  const t = x.tier === 'lite' ? 'Lite' : 'Pro';
  if(x.paid) return `<span class="tag paid">${t} 付費</span>${x.unsub ? ' <span class="tag warn">已取消續訂</span>' : ''}`;
  if(isGift(x)) return `<span class="tag gift">贈送 ${t}</span>`;
  if(x.product && !x.product.startsWith('rc_promo')) return '<span class="tag">訂閱已到期</span>';
  return x.onboarded ? '<span class="tag">免費</span>' : '<span class="tag warn">沒完成引導</span>';
}
function drawUsers(){
  const L = APP.users, el = $('#ulist'); if(!L || !el) return;
  const q = UF.q.trim().toLowerCase(), f = (FILTERS.find(x => x[0] === UF.plan) || FILTERS[0])[2];
  const rows = L.users.filter(x => f(x) && (!q || (x.email || '').toLowerCase().includes(q) || x.id.startsWith(q)))
    .sort((a, b) => { const k = UF.sort, va = a[k] ?? '', vb = b[k] ?? ''; return va < vb ? 1 : va > vb ? -1 : 0; });
  el.innerHTML = rows.map(x => `<tr class="r" onclick="openModal('user','${x.id}')">
    <td class="em" title="${esc(x.email)}">${esc(x.email || '（沒有 email）')}</td><td>${planTag(x)}</td>
    <td title="${esc(x.seen || '')}">${ago(x.seen)}</td><td class="n">${x.cards || '<span class="dim">0</span>'}</td></tr>`).join('') || '<tr><td colspan="4" class="dim">沒有符合的使用者</td></tr>';
}
function userModal(id){

      .catch(e => { if(!APP.detail[id]) APP.detail[id] = {error: e.message || String(e)}; })
      .finally(() => { APP.busy[id] = false; if(modalFor && modalFor[1] === id) openModal('user', id); });
  }
  const tags = [planTag(x), nm('login', x.login), x.platform && nm('platform', x.platform) + ' ' + (x.version || ''), nm('lang', x.lang) + '母語', x.level && nm('level', x.level), x.goal && nm('goal', x.goal)]
    .filter(Boolean).map(t => t.startsWith('<') ? t : `<span class="tag">${esc(t)}</span>`).join(' ');
  let body = '<div class="sk" style="height:150px;margin-top:14px"></div>';
  if(d?.error) body = `<div class="err">${esc(d.error)}</div>`;
  else if(d){

    body = `<div class="card" style="margin-top:14px;background:var(--panel2)"><h3>近 30 天每天做的卡片</h3>${bars(last30, 'n', '#B79CFF', v => v + ' 張')}</div>
      <details class="more"><summary>最近的卡片（${x.cards}）</summary><div class="list">${d.cards.map(c => `<div><span class="t">${esc(c.at.slice(5))}</span><span class="w"><b>${esc(c.w)}</b> <span class="dim">${esc(c.pos || '')}</span></span><span class="dim">${esc(nm('source', c.src))}</span></div>`).join('') || '<div class="dim">還沒做卡片</div>'}</div></details>
      <details class="more"><summary>最近的 App 紀錄</summary><div class="list">${d.events.map(e => `<div><span class="t">${esc(e.at)}</span><span class="w lv-${esc(e.level)}" title="${esc(e.category)}">${esc(e.event)}</span><span class="dim">${esc(e.v || '')}</span></div>`).join('') || '<div class="dim">沒有紀錄</div>'}</div></details>
      <details class="more" ${x.paid || isGift(x) ? 'open' : ''}><summary>訂閱紀錄（${d.subs.length}）</summary>
      ${d.subs.length ? `<table><tr><th>方案</th><th>開始</th><th>到期</th></tr>${d.subs.map(s => `<tr><td>${esc(s.product_id || '—')}${s.environment !== 'production' ? ` <span class="dim">${esc(s.environment)}</span>` : ''}</td><td>${esc(s.started || '—')}</td><td>${esc(s.expires || '—')}</td></tr>`).join('')}</table>` : '<div class="list"><div class="dim">沒有訂閱紀錄</div></div>'}</details>`;
  }
  return `<div class="title" style="padding-right:40px;word-break:break-all">${esc(x.email || '（沒有 email）')}</div>
    <div class="row">${tags}</div>
    <div class="stats"><div><b>${esc(x.joined.slice(0, 10))}</b><span>註冊</span></div><div><b>${ago(x.seen)}</b><span>最後活躍</span></div>
      <div><b>${x.cards}</b><span>卡片・近 7 天 ${x.cards7}</span></div><div><b>${x.paid ? 'NT$' + (x.price ?? '—') : esc(x.expires || '—')}</b><span>${x.paid ? '訂閱金額・到期 ' + esc(x.expires || '') : '方案到期'}</span></div></div>
    <div class="row"><a class="chip" href="${APP.users.rc}${x.id}" target="_blank" rel="noopener">在 RevenueCat 打開 ↗</a>
      <span class="chip pick" onclick="navigator.clipboard.writeText('${x.id}');toast('已複製使用者編號')">複製使用者編號</span>
      <span class="dim" style="font-size:12px">AI 成本 NT$${x.ai_twd}${d?.ai ? `・${d.ai.calls} 次` : ''}</span></div>
    ${body}`;
}
// ---------- 第二層（drill-down）：點長條 / 漏斗 / 組成 → 那群人或那天的明細，再點人 → 個人頁，可以一路返回 ----------
const SEG = ['platform', 'login', 'lang', 'level', 'goal', 'version'];
const STACK = [];
const drill = spec => openModal('drill', spec);
function openUser(id){ STACK.push(modalFor); openModal('user', id); }
function back(){ const p = STACK.pop(); if(p) openModal(...p); else closeModal(); }
const uById = id => (APP.users?.users || []).find(u => u.id === id);
const FUNNEL = [x => true, x => x.onboarded, x => x.cards >= 1, x => x.cards >= 5, x => x.paid];
const MLABEL = {active: '活躍的人', signups: '新註冊', cards: '新卡片', ai: 'AI 成本'};
function shiftDay(iso, n){ const t = new Date(iso + 'T12:00:00+08:00'); t.setDate(t.getDate() + n); return t.toLocaleDateString('sv-SE', {timeZone: 'Asia/Taipei'}); }
// 人的清單：extra = [[欄名, x => 內容], ...]
function peopleTable(list, extra = []){
  if(!list.length) return '<div class="empty">沒有人</div>';
  return `<div class="tscroll"><table class="users"><thead><tr><th>Email</th><th>方案</th>${extra.map(e => `<th class="n">${e[0]}</th>`).join('')}<th>最後活躍</th></tr></thead><tbody>
    ${list.map(([x, row]) => x ? `<tr class="r" onclick="openUser('${x.id}')"><td class="em">${esc(x.email || '（沒有 email）')}</td><td>${planTag(x)}</td>
      ${extra.map(e => `<td class="n">${e[1](x, row)}</td>`).join('')}<td>${ago(x.seen)}</td></tr>` : '').join('')}</tbody></table></div>`;
}
function drillModal(spec){
  const [kind, a, b] = spec.split(':'), U = APP.users?.users || [];
  if(!APP.users) return '<div class="sk" style="height:200px"></div>';
  const head = (t, sub, nav) => `<div class="title">${t}</div><div class="sub">${sub}</div>${nav || ''}<div style="height:12px"></div>`;
  if(kind === 'seg'){
    const list = U.filter(x => (x[a] ?? '?') === b);
    return head(`${{platform: '裝置', login: '登入方式', lang: '母語', level: '英文程度', goal: '學習目標', version: 'App 版本'}[a]}：${esc(nm(a, b))}`, `${list.length} 人`)
      + peopleTable(list.map(x => [x]), [['卡片', x => x.cards]]);
  }
  if(kind === 'funnel'){
    const f = APP.data?.funnel || [], i = +a, now = U.filter(FUNNEL[i]), next = FUNNEL[i + 1] ? now.filter(x => !FUNNEL[i + 1](x)) : [];
    return head(`漏斗：${esc(f[i]?.k || '')}`, `${now.length} 人${next.length ? `・其中 ${next.length} 人卡在下一步「${esc(f[i + 1].k)}」之前` : ''}`)
      + (next.length ? `<h2>卡在這一步的人（可以去關心一下）</h2>${peopleTable(next.map(x => [x]), [['卡片', x => x.cards]])}<h2>全部</h2>` : '')
      + peopleTable(now.map(x => [x]), [['卡片', x => x.cards]]);
  }
  // day:指標:日期 —— 上一天 / 下一天可以直接切
  const today = new Date().toLocaleDateString('sv-SE', {timeZone: 'Asia/Taipei'});
  const nav = `<div class="dnav"><button class="small" onclick="openModal('drill','day:${a}:${shiftDay(b, -1)}')">‹ 前一天</button>
    <button class="small" ${b >= today ? 'disabled' : ''} onclick="openModal('drill','day:${a}:${shiftDay(b, 1)}')">後一天 ›</button></div>`;
  const title = `${b.slice(5).replace('-', '/')} 的${MLABEL[a]}`;
  if(a === 'signups'){
    const list = U.filter(x => x.joined.startsWith(b));
    return head(title, `${list.length} 人`, nav) + peopleTable(list.map(x => [x]), [['註冊時間', x => x.joined.slice(11)], ['卡片', x => x.cards]]);
  }
  const key = spec, d = APP.detail[key];
  if(!d && !APP.busy[key]){
    APP.busy[key] = true;
    fetch(`/api/day?d=${b}&m=${a}`).then(r => r.json().then(j => { if(!r.ok) throw new Error(j.error || r.status); APP.detail[key] = j.rows; }))
      .catch(e => APP.detail[key] = {error: e.message || String(e)})
      .finally(() => { APP.busy[key] = false; if(modalFor && modalFor[1] === key) openModal('drill', key); });
  }
  if(!d) return head(title, '讀取中…', nav) + '<div class="sk" style="height:200px"></div>';
  if(d.error) return head(title, '', nav) + `<div class="err">${esc(d.error)}</div>`;
  if(a === 'active') return head(title, `${d.length} 人`, nav)
    + peopleTable(d.map(r => [uById(r.id), r]), [['動作數', (x, r) => r.n], ['做卡片', (x, r) => r.cards || '<span class="dim">0</span>'], ['用 AI', (x, r) => r.ai || '<span class="dim">0</span>']]);
  if(a === 'cards'){
    const by = {}; d.forEach(c => (by[c.id] = by[c.id] || []).push(c));
    return head(title, `${d.length} 張・${Object.keys(by).length} 人做的`, nav)
      + `<div class="card" style="background:var(--panel2);margin-bottom:10px"><h3>從哪裡來</h3>${hbars(d.reduce((o, c) => (o[c.src || '?'] = (o[c.src || '?'] || 0) + 1, o), {}), 'source', '#B79CFF')}</div>`
      + Object.entries(by).sort((p, q) => q[1].length - p[1].length).map(([id, cs]) => { const x = uById(id);
        return `<details class="more"><summary>${esc(x?.email || id)} <span class="dim">・${cs.length} 張</span></summary>
          <div class="list">${cs.map(c => `<div><span class="t">${esc(c.at)}</span><span class="w"><b>${esc(c.w)}</b> <span class="dim">${esc(c.pos || '')}</span></span><span class="dim">${esc(nm('source', c.src))}</span></div>`).join('')}
          ${x ? `<div><a href="#" onclick="openUser('${id}');return false" style="color:var(--blue)">看這個人 →</a></div>` : ''}</div></details>`; }).join('');
  }
  const tot = d.by.reduce((s, r) => s + Number(r.twd), 0);
  return head(title, `NT$${tot.toFixed(2)}・${d.by.reduce((s, r) => s + r.n, 0)} 次呼叫`, nav)
    + `<div class="card" style="background:var(--panel2);margin-bottom:10px"><h3>花在哪個功能</h3>${d.by.map(r => `<div class="hb"><span>${esc({generate_card: '產生卡片', text_to_speech: '朗讀', pronunciation_assessment: '發音評分'}[r.k] || r.k)}</span><span class="cbar"><i style="width:${tot ? r.twd / tot * 100 : 0}%;background:var(--warn)"></i></span><span class="num">NT$${r.twd}<span class="dim" style="font-weight:400"> ${r.n} 次</span></span></div>`).join('')}</div>`
    + `<h2>誰用的</h2>` + peopleTable(d.users.map(r => [uById(r.id), r]), [['次數', (x, r) => r.n], ['成本', (x, r) => 'NT$' + r.twd]]);
}

function itemModal(id){
  const i = S.items.find(x => x.id === id); if(!i) return '<div class="empty">找不到</div>';
  const open = queuedList().includes(i);
  const chipsHtml = i.platforms.map(p => pf(p, true)).join('');
  const manual = i.platforms.filter(p => p.status==='manual').map((p,k) => `<div class="kind"><b>${esc(p.label)}</b>
      <div class="strip" style="margin-top:6px">${p.media.map(m => /\.mp4/.test(m) ? `<a class="chip" href="${esc(m)}" target="_blank">下載影片</a>` : `<a href="${esc(m)}" target="_blank"><img src="${esc(m)}" style="height:90px"></a>`).join('')}</div>
      <textarea readonly style="min-height:90px" onclick="this.select();navigator.clipboard?.writeText(this.value);toast('文案已複製')">${esc(p.caption)}</textarea>
      <div class="row"><input type="text" id="u${k}" placeholder="貼文網址（選填）" style="flex:1"><button class="primary small" onclick="api('done',{id:'${i.id}',platform:'${p.name}',url:$('#u${k}').value})">發好了</button></div></div>`).join('');
  const perf = i.platforms.filter(p=>Object.keys(p.scores).length).map(p=>`<div class="perf"><b>${esc(p.label)}</b> ${Object.entries(p.scores).map(([k,v])=>`${LBL[k]} ${k==='hook'?Math.round(v*100)+'%':v+'‰'}`).join(' · ')}
      <span class="dim">（${{d7:'第 7 天',d3:'第 3 天',latest:'即時'}[p.snapshot]}${p.ratio!=null?'，中位數的 '+p.ratio.toFixed(1)+' 倍':''}）</span></div>`).join('');
  const retry = i.platforms.filter(p=>p.status==='failed' || (!open && p.status==='skipped'))   // 還沒發的用上面的勾選加回略過的平台.map(p=>`<button class="small" onclick="api('retry',{id:'${i.id}',platform:'${p.name}'})">重發 ${esc(p.label)}</button>`).join('');
  // 封面：IG Reels 封面和 YouTube 縮圖用同一張；還沒發的影片可以從影片挑一格換掉
  const coverTools = open && i.kind === 'reel' ? `
      <div class="sub" style="margin-top:12px">${i.cover_at == null && i.slide_cover ? '封面：輪播封面那張' : i.cover ? `封面：影片第 ${i.cover_at ?? 1} 秒` : '還沒有封面'}</div>
      ${i.video ? `<video id="cv" src="${esc(i.video)}" controls preload="metadata" style="margin-top:6px"></video>
        <div class="row"><button class="small" onclick="api('cover',{id:'${i.id}',at:$('#cv').currentTime.toFixed(1)})">用目前這一格當封面</button>
        ${i.slide_cover && i.cover_at != null ? `<button class="small" onclick="api('cover',{id:'${i.id}',at:'slide'})">改回輪播封面</button>` : ''}</div>` : ''}` : '';
  // 輪播：整組每一張排成一列，放在內容下面
  const slideTools = i.kind === 'carousel' && i.slides?.length > 1 ? `
    <div class="sub" style="margin-top:16px">整組 ${i.slides.length} 張</div>
    <div class="strip" style="margin-top:6px">${i.slides.map(s => `<a href="${esc(s)}" target="_blank" style="flex:none"><img src="${esc(s)}" style="height:340px"></a>`).join('')}</div>` : '';
  return `<div class="cols"><div class="media"><span class="th"><img src="${esc(i.kind==='carousel' && i.slides?.[0] || i.cover || i.thumb)}" style="width:260px;border-radius:10px"><span class="kd ${i.kind}">${KSVG[i.kind]}<span>${KNAME[i.kind]}</span></span></span>${coverTools}</div><div class="info">
    <div class="title">${esc(i.topic)} ${i.rating?`<span class="chip">${esc(i.rating)}</span>`:''}</div>
    <div class="sub">${kt(i.kind, i.kind==='carousel'?' '+i.count+' 張':'')} · ${esc(i.tags.format||'')} ${i.tags.show?`<span class="chip tag" title="比成效用的標籤">劇名：${esc(i.tags.show)}</span>`:''} ${i.tags.hook?`<span class="chip tag" title="比成效用的標籤">開頭：${esc(i.tags.hook)}</span>`:''}</div>
    <div class="row">${open ? `<input type="datetime-local" value="${i.when_iso}" onchange="api('time',{id:'${i.id}',at:this.value})">` :`<span class="sub">${esc(i.when)}</span> ${kt(i.kind)}`}</div>
    ${open ? `<div class="sub" style="margin-top:12px">發到哪些平台</div>${pfPicker(i.kind, active(i).map(p=>p.name))}
      <div class="row"><button class="small" onclick="if(!picked().length)return toast('至少勾一個平台');api('item-platforms',{id:'${i.id}',list:picked()})">儲存平台</button></div>`
      : `<div class="row">${chipsHtml}</div>`}
    ${i.platforms.filter(p=>p.error).map(p=>`<div class="err">${esc(p.label)}：${esc(p.error)}</div>`).join('')}
    ${i.platforms.filter(p=>p.note).map(p=>`<div class="note">${esc(p.label)}：${esc(p.note)}</div>`).join('')}
    ${i.job?`<div class="note">${esc(i.job)}</div>`:''}

    ${perf}${manual}
    <div class="sub" style="margin-top:12px">文案</div><textarea id="mc">${esc(i.caption)}</textarea>

  </div></div>${slideTools}`;
}

  lists.forEach(([k, list]) => api('platforms', {channel:S.channel, kind:k, list}));
}
let checkOut = '';   // 存起來，背景讀回資料重畫設定頁時才不會不見
function check(){
  checkOut = '檢查中…'; render();
  api('check', {channel:S.channel}, true).then(t => { checkOut = t.message; if(tab === 'settings') render(); });
}

// ---------- 詳細頁開關 ----------
function openModal(type, a, b, at){
  modalFor = [type, a, b, at];
  $('#sheet').innerHTML = `<button class="small x" onclick="closeModal()">✕</button>` + (STACK.length && (type==='user' || type==='drill') ? `<button class="small ghost" style="margin:-6px 0 6px -8px" onclick="back()">← 返回</button>` : '')
    + (type==='drill' ? drillModal(a) : type==='user' ? userModal(a) : type==='inbox' ? (S.inbox[a]?.kinds[b] ? inboxModal(a,b,at) : '<div class="empty">已排進發文</div>') : itemModal(a));
  const m = $('#modal');   // 只有從關著打開才播動畫，操作後刷新不會再彈一次
  if(!m.classList.contains('on')){ m.classList.add('on', 'opening'); setTimeout(() => m.classList.remove('opening'), 300); }
}
function closeModal(){ modalFor = null; STACK.length = 0; $('#modal').classList.remove('on'); }
document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });

renderTray(); load();
setInterval(() => { if(!modalFor && !pending().length && !document.querySelector('textarea:focus,input:focus')) load(true); }, 30000);
</script></body></html>
