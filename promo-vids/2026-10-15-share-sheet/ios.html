<!doctype html>
<html><head><meta charset="utf-8">
<!-- Nuances share-sheet promo — iOS (iOS 26-style, generic, no Apple assets). renderFrame(t) is deterministic. -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#fff}
body{font-family:'Inter Display','Noto Sans CJK TC',sans-serif;-webkit-font-smoothing:antialiased;color:#1C1C1E}
.cjk{font-family:'Noto Sans CJK TC';font-weight:500}
#stage{position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 40%,#fff 0%,#F2F4F8 100%)}
#tag{position:absolute;left:0;right:0;top:118px;text-align:center}
#tag span{display:inline-block;padding:12px 30px;border-radius:40px;background:#1C1C1E;color:#fff;font:600 34px 'Inter Display';letter-spacing:.5px}
.cap{position:absolute;left:0;right:0;top:196px;text-align:center;font-size:76px;line-height:1.1;white-space:nowrap}
.cap b{font:700 76px 'Inter Display';color:#2F8FE0;margin-right:22px}
#end{position:absolute;left:0;right:0;top:250px;text-align:center;font-size:150px;line-height:1.18}
#end div{background:linear-gradient(90deg,#3F97E8,#6DBCF6);-webkit-background-clip:text;color:transparent;opacity:0}
#phone{position:absolute;left:50%;top:0;transform-origin:50% 0}
.frame{position:absolute;inset:0;background:linear-gradient(135deg,#d9dade,#a9abb1 40%,#e4e5e8 60%,#9fa1a7);box-shadow:0 60px 120px rgba(20,30,50,.22),0 12px 30px rgba(20,30,50,.18)}
.frame:after{content:'';position:absolute;inset:5px;border-radius:inherit;background:#0b0b0c}
#scr{position:absolute;overflow:hidden;background:#fff;z-index:2}
#scrin{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden}
.sb{position:absolute;left:0;right:0;top:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:6px 32px 0 48px;font:600 17px 'Inter Display';z-index:3}
.sbi{display:flex;gap:6px;align-items:center}
.island{position:absolute;left:50%;top:11px;width:124px;height:36px;margin-left:-62px;background:#000;border-radius:20px;z-index:99}
/* article */
.app{position:absolute;inset:0;background:#fff}
.nav{position:absolute;top:54px;left:0;right:0;height:44px;display:flex;align-items:center;padding:0 16px;color:#007AFF;font:400 17px 'Noto Sans CJK TC'}
.art{position:absolute;top:104px;left:22px;right:22px}
.art .k{font:600 13px 'Inter Display';letter-spacing:.8px;color:#8E8E93}
.art h1{font:700 30px/1.15 'Inter Display';letter-spacing:-.6px;margin:8px 0 10px}
.art .by{font:400 14px 'Inter Display';color:#8E8E93;margin-bottom:18px}
.art .hero{height:150px;border-radius:14px;background:linear-gradient(135deg,#232733,#10131a);position:relative;overflow:hidden;margin-bottom:20px}
.art .hero:after{content:'';position:absolute;left:55%;top:30%;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,#3c8f4a 0%,transparent 65%);opacity:.8}
.art p{font:400 19px/1.55 'Inter Display';color:#2c2c2e;margin-bottom:14px}
.art p u{text-decoration:none;background:linear-gradient(transparent 60%,#FFE58A 60%)}
#thumb,#fly{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:#fff}
#thumb{z-index:30}#fly{z-index:70;opacity:0;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:40}
#scrim{position:absolute;inset:0;background:#000;opacity:0;z-index:45}
/* iOS 26 screenshot editor (dark) */
#editor{position:absolute;inset:0;background:#23211e;opacity:0;z-index:25}
.top{position:absolute;top:58px;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.gc{width:52px;height:52px;border-radius:50%;background:rgba(58,56,52,.9);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 0 0 .5px rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;position:relative}
.gp{height:52px;border-radius:26px;background:rgba(58,56,52,.9);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 0 0 .5px rgba(255,255,255,.1);display:flex;align-items:center;gap:6px;padding:0 6px}
.gp .b{width:50px;height:46px;border-radius:23px;display:flex;align-items:center;justify-content:center;position:relative}
.ok{background:#E8E8E8}
#crop{position:absolute;opacity:0;pointer-events:none}
#crop i{position:absolute;width:30px;height:30px;border:0 solid #fff}
#crop b{position:absolute;background:#fff;border-radius:1px}
.ctx{position:absolute;bottom:56px;left:0;right:0;text-align:center;font:400 17px 'Noto Sans CJK TC';color:#9a9894}
.scan{position:absolute;right:20px;bottom:44px;width:42px;height:42px;border-radius:50%;background:rgba(58,56,52,.9);display:flex;align-items:center;justify-content:center}
/* iOS 26 share sheet (glass) */
#sheet{position:absolute;left:8px;right:8px;bottom:8px;height:404px;border-radius:44px;background:rgba(246,246,248,.9);backdrop-filter:blur(30px) saturate(1.6);box-shadow:0 -10px 40px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.9);z-index:50;transform:translateY(560px);overflow:hidden}
.hd{display:flex;align-items:center;gap:12px;padding:22px 18px 6px 22px}
.hd .im{width:44px;height:60px;border-radius:9px;overflow:hidden;position:relative;background:#fff;box-shadow:0 0 0 .5px rgba(0,0,0,.15)}
.hd .t1{font:600 17px 'Noto Sans CJK TC'}.hd .t2{font:400 14px 'Noto Sans CJK TC';color:#8E8E93;margin-top:2px}
.hd .x{margin-left:auto;width:36px;height:36px;border-radius:50%;background:rgba(120,120,128,.14);display:flex;align-items:center;justify-content:center}
.row{display:flex;gap:16px;padding:18px 0 4px 22px;overflow:hidden;white-space:nowrap}
.it{width:66px;flex:none;text-align:center;position:relative}
.it .ic{width:66px;height:66px;margin:0 auto;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.it .sq{border-radius:16px}
.it .lb{font:400 12px 'Noto Sans CJK TC';color:#1C1C1E;margin-top:7px;white-space:nowrap}
.acts{margin:14px 16px 0;border-radius:18px;background:rgba(255,255,255,.95);overflow:hidden}
.act{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font:400 17px 'Noto Sans CJK TC';border-bottom:.5px solid #E5E5EA}
.act:last-child{border-bottom:0}
/* Nuances confirmation card */
/* iOS 26 notification banner (liquid glass, top) */
#ext{position:absolute;left:10px;right:10px;top:54px;height:76px;border-radius:30px;z-index:60;transform:translateY(-160px);display:flex;align-items:center;gap:12px;padding:0 18px 0 12px;
  background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(246,246,248,.9));backdrop-filter:blur(30px) saturate(1.8);
  box-shadow:0 12px 36px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.95),inset 0 0 0 1px rgba(255,255,255,.55),inset 0 -1px 0 rgba(0,0,0,.06)}
#ext .tx{flex:1;line-height:1.2}
#ext .ti{font:700 17px 'Inter Display'}
#ext .ms{font:400 16px 'Noto Sans CJK TC','Noto Color Emoji';margin-top:2px}
#ext .tm{align-self:flex-start;margin-top:15px;font:400 14px 'Noto Sans CJK TC';color:#8E8E93}
/* virtual taps */
.press{position:absolute;inset:0;border-radius:inherit;background:rgba(0,0,0,.14);opacity:0;pointer-events:none}
#hl{position:absolute;border:4px solid #2F8FE0;box-shadow:0 0 0 8px rgba(47,143,224,.25),0 0 24px rgba(47,143,224,.5);z-index:88;opacity:0;pointer-events:none}
#dot{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(40,40,48,.38);border:3.5px solid #fff;box-shadow:0 6px 18px rgba(0,0,0,.35);z-index:90;opacity:0}
#ring{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;border:4px solid #2F8FE0;z-index:89;opacity:0}
</style></head>
<body>
<div id="stage">
  <div id="tag"><span>iOS</span></div>
  <div class="cap cjk" id="c0"></div><div class="cap cjk" id="c1"></div><div class="cap cjk" id="c2"></div>
  <div id="end" class="cjk"><div id="e0"></div><div id="e1"></div></div>
  <div id="phone"><div class="frame" id="frame"></div><div id="scr"><div id="scrin"></div></div></div>
</div>
<script>
// ===== copy (localize here) =====
const STR = {
  'zh-TW': { steps: ['截圖', '分享', '選 Nuances'], end: ['不開app', '就能傳'], bMsg: '收到', bTime: '現在',
    back: '‹ 返回', head: '螢幕截圖', headS: '選項 ›',
    people: [['小', '小美', '#F28B54'], ['傑', '阿傑', '#5B8DEF'], ['媽', '媽媽', '#E66A9A'], ['志', '志明', '#47B39C']],
    apps: ['Nuances', '訊息', '郵件', '備忘錄', '提醒事項'], acts: ['拷貝', '儲存影像', '儲存到檔案'], crop: '裁切並縮放' }
};
const q = new URLSearchParams(location.search), L = STR[q.get('locale') || 'zh-TW'];
const $ = id => document.getElementById(id);

// ===== geometry =====
const PT = [393, 852], SW = 640, K = SW / PT[0], SH = PT[1] * K, BZ = 18, PR = 92;
const PW = SW + 2 * BZ, PH = SH + 2 * BZ, PTOP = 330;
const phone = $('phone'), scr = $('scr'), sin = $('scrin');
Object.assign(phone.style, {width: PW + 'px', height: PH + 'px', marginLeft: -PW / 2 + 'px'});
$('frame').style.borderRadius = PR + 'px';
Object.assign(scr.style, {left: BZ + 'px', top: BZ + 'px', width: SW + 'px', height: SH + 'px', borderRadius: (PR - BZ) + 'px'});
Object.assign(sin.style, {width: PT[0] + 'px', height: PT[1] + 'px', transform: `scale(${K})`});

// ===== generic glyphs (no Apple assets) =====
const W = (w, d, f = '#fff') => `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="${f}">${d}</svg>`;
const BUB = '<path d="M12 3C6.5 3 2 6.6 2 11c0 2.5 1.4 4.7 3.6 6.1L5 21l4-2.2c1 .3 2 .4 3 .4 5.5 0 10-3.6 10-8.1S17.5 3 12 3z"/>';
const G = {
  msg: W(34, BUB),
  mail: W(36, '<rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M3.5 6.5l8.5 6.5 8.5-6.5" stroke="#1E88F5" stroke-width="1.6" fill="none"/>'),
  note: W(40, '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M7 8h10M7 12h10M7 16h6" stroke="#E0A800" stroke-width="1.5"/>'),
  share: W(22, '<path d="M12 15V3M7.5 7.5L12 3l4.5 4.5"/><path d="M8 10H6a1.5 1.5 0 00-1.5 1.5v8A1.5 1.5 0 006 21h12a1.5 1.5 0 001.5-1.5v-8A1.5 1.5 0 0018 10h-2"/>', 'none').replace('fill="none"', 'fill="none" stroke="#1C1C1E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"'),
  wx: W(22, '<path d="M5 5l14 14M19 5L5 19" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>', 'none'),
  ok: W(24, '<path d="M4.5 12.5l5 5L19.5 6.5" stroke="#1C1C1E" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>', 'none'),
  pen: W(26, '<circle cx="12" cy="12" r="9.5" stroke="#fff" stroke-width="1.8" fill="none"/><path d="M9 17l3-10 3 10M10 14h4" stroke="#fff" stroke-width="1.6" fill="none" stroke-linejoin="round"/>', 'none'),
  wshare: W(26, '<path d="M12 15V3M7.5 7.5L12 3l4.5 4.5" stroke="#fff" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 10H6a1.5 1.5 0 00-1.5 1.5v8A1.5 1.5 0 006 21h12a1.5 1.5 0 001.5-1.5v-8A1.5 1.5 0 0018 10h-2" stroke="#fff" stroke-width="1.9" fill="none" stroke-linecap="round"/>', 'none'),
  scan: W(22, '<path d="M4 8V5a1 1 0 011-1h3M16 4h3a1 1 0 011 1v3M20 16v3a1 1 0 01-1 1h-3M8 20H5a1 1 0 01-1-1v-3M8 9h8M8 12h8M8 15h5" stroke="#d8d6d2" stroke-width="1.6" fill="none" stroke-linecap="round"/>', 'none'),
  aCopy: W(22, '<rect x="8" y="8" width="12" height="12" rx="2.5" stroke="#1C1C1E" stroke-width="1.7" fill="none"/><path d="M16 5.5V5a2 2 0 00-2-2H6a2 2 0 00-2 2v8a2 2 0 002 2h.5" stroke="#1C1C1E" stroke-width="1.7" fill="none"/>', 'none'),
  aSave: W(22, '<path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19h14" stroke="#1C1C1E" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>', 'none'),
  aFile: W(22, '<path d="M3.5 7a2 2 0 012-2h4l2 2h7a2 2 0 012 2v8a2 2 0 01-2 2h-13a2 2 0 01-2-2z" stroke="#1C1C1E" stroke-width="1.7" fill="none"/>', 'none'),
  x: '<svg width="12" height="12" viewBox="0 0 12 12" stroke="#6b6b70" stroke-width="2" stroke-linecap="round"><path d="M2 2l8 8M10 2l-8 8"/></svg>',
  check: W(18, '<path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>', 'none'),
};
const nIcon = r => `<img src="icon.svg" style="width:100%;height:100%;border-radius:${r}">`;

// ===== screen content =====
const statusBar = (c = '#000') => `<div class="sb" style="color:${c}"><span>9:41</span><span class="sbi">
  <svg width="18" height="12"><g fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></g></svg>
  <svg width="16" height="12" viewBox="0 0 16 12"><path fill="currentColor" d="M8 12l2.3-2.6a3.3 3.3 0 00-4.6 0zM3.7 7.2a6 6 0 018.6 0l1.4-1.6a8.2 8.2 0 00-11.4 0zM.4 3.6a10.7 10.7 0 0115.2 0L16.9 2A12.8 12.8 0 00-.9 2z"/></svg>
  <svg width="27" height="13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2.5" y="2.5" width="19" height="8" rx="2" fill="currentColor"/><rect x="25" y="4.5" width="1.5" height="4" rx=".7" fill="currentColor" opacity=".4"/></svg></span></div>`;
const article = (st = '') => `<div class="app" ${st}>${statusBar()}<div class="nav">${L.back}</div>
  <div class="art"><div class="k">BIOGRAPHY</div><h1>Jensen Huang: From Dishwasher to AI Pioneer</h1>
  <div class="by">8 min read</div><div class="hero"></div>
  <p>Born in Tainan, Jensen Huang moved to America at nine, where his first job was cleaning toilets.</p>
  <p><u>Undeterred</u>, he worked his way through school, an <u>unassuming</u> kid with a <u>relentless</u> drive.</p>
  <p>Decades later, the company he co-founded would reshape computing.</p></div></div>`;
const mini = s => article(`style="transform:scale(${s});transform-origin:0 0;width:393px;height:852px"`);
const item = (inner, cls, bg, lb, id, extra = '') =>
  `<div class="it" ${id ? `id="${id}"` : ''}><div class="ic ${cls}" style="background:${bg}">${inner}<div class="press"></div></div>${extra}<div class="lb">${lb}</div></div>`;
const APPS = [[null], ['#34C759', G.msg], ['#1E88F5', G.mail], ['#FFD43B', G.note], ['#fff', W(40, '<circle cx="7" cy="8" r="2" fill="#FF3B30"/><circle cx="7" cy="14" r="2" fill="#007AFF"/><path d="M11 8h8M11 14h8" stroke="#8E8E93" stroke-width="1.6"/>', 'none')]];

sin.innerHTML = article() + `<div id="editor">${statusBar('#fff')}<div class="top"><div class="gc">${G.wx}</div>
    <div style="display:flex;gap:10px"><div class="gp"><div class="b">${G.pen}</div><div class="b" id="shareBtn">${G.wshare}<div class="press" style="background:rgba(255,255,255,.22)"></div></div></div>
    <div class="gc ok">${G.ok}</div></div></div>
  <div class="ctx">${L.crop}</div><div class="scan">${G.scan}</div></div>
<div id="crop"></div>
<div id="thumb">${article()}<div class="press"></div></div><div id="flash"></div><div id="scrim"></div>
<div id="sheet">
  <div class="hd"><div class="im">${mini(44 / 393)}</div><div><div class="t1">${L.head}</div><div class="t2">${L.headS}</div></div><div class="x">${G.x}</div></div>
  <div class="row">${APPS.map((a, i) => item(a[0] ? a[1] : nIcon('16px'), 'sq', a[0] || '#fff', L.apps[i], i == 0 ? 'nApp' : '')).join('')}</div>
  <div class="acts">${L.acts.map((s, i) => `<div class="act">${s}${[G.aCopy, G.aSave, G.aFile][i]}</div>`).join('')}</div>
</div>
<div id="ext"><div style="width:52px;height:52px;flex:none" id="tIcon">${nIcon('12px')}</div><div class="tx"><div class="ti">Nuances</div><div class="ms">${L.bMsg}</div></div><div class="tm">${L.bTime}</div></div>
<div id="fly">${article()}</div><div id="hl"></div><div id="ring"></div><div id="dot"></div><div class="island"></div>`;

L.steps.forEach((s, i) => $('c' + i).innerHTML = `<b>${i + 1}</b>${s}`);
$('e0').textContent = L.end[0]; $('e1').textContent = L.end[1];

// ===== timing (s) =====
const T = {shot: .6, tapThumb: 1.5, editor: 1.6, tapShare: 2.55, sheet: 2.7, tapN: 3.95, out: 4.1, fly: 4.15, check: 4.75, end: 5.55, dur: 7.85};
const STEP = [.25, 2.1, 3.35];
const TAPS = [{t: T.tapThumb, id: 'thumb', r: '10px'}, {t: T.tapShare, id: 'shareBtn', r: '50%'}, {t: T.tapN, id: 'nApp', sel: '.ic', r: '16px'}];

// ===== helpers =====
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), seg = (t, a, b) => cl((t - a) / (b - a));
const eo = x => 1 - Math.pow(1 - x, 3), eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => { const c = 1.4; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
const TW = 108, TH = TW * PT[1] / PT[0], TX = 16, TY = PT[1] - TH - 30;
const EW = 276, EX = (PT[0] - EW) / 2, EY = 132, EH = EW * PT[1] / PT[0];
// crop brackets around the editor image (iOS 26 style)
(() => { const c = $('crop'), o = 8, L2 = 30, w = 3.5; let h = '';
  [[0,0,'Top','Left'],[1,0,'Top','Right'],[0,1,'Bottom','Left'],[1,1,'Bottom','Right']].forEach(([i,j,v,hz]) => h += `<i style="${i?'right':'left'}:${-o}px;${j?'bottom':'top'}:${-o}px;border-${v.toLowerCase()}-width:${w}px;border-${hz.toLowerCase()}-width:${w}px;border-${v.toLowerCase()}-${hz.toLowerCase()}-radius:28px"></i>`);
  h += `<b style="left:50%;top:${-o}px;width:34px;height:${w}px;margin-left:-17px"></b><b style="left:50%;bottom:${-o}px;width:34px;height:${w}px;margin-left:-17px"></b><b style="top:50%;left:${-o}px;height:34px;width:${w}px;margin-top:-17px"></b><b style="top:50%;right:${-o}px;height:34px;width:${w}px;margin-top:-17px"></b>`;
  c.innerHTML = h; Object.assign(c.style, {left: EX + 'px', top: EY + 'px', width: EW + 'px', height: EH + 'px', zIndex: 31}); })();
function box(el, x, y, w, r, op = 1) {
  const s = w / PT[0];
  Object.assign(el.style, {width: PT[0] + 'px', height: PT[1] + 'px', transform: `translate(${x}px,${y}px) scale(${s})`, borderRadius: r / s + 'px', opacity: op});
}
function rectOf(el) {
  const e = el.getBoundingClientRect(), s = sin.getBoundingClientRect(), k = s.width / PT[0];
  return {x: (e.left - s.left) / k, y: (e.top - s.top) / k, w: e.width / k, h: e.height / k};
}
// Virtual tap: dot glides in (0.45 s), target gets a blue highlight, contact = dot squashes + ripple ring + pressed state.
function taps(t) {
  const dot = $('dot'), ring = $('ring'), hl = $('hl');
  dot.style.opacity = ring.style.opacity = hl.style.opacity = 0;
  document.querySelectorAll('.press').forEach(p => p.style.opacity = 0);
  for (const tp of TAPS) {
    const a = tp.t - .45, z = tp.t + .45;
    if (t < a || t > z) continue;
    const host = $(tp.id), tgt = tp.sel ? host.querySelector(tp.sel) : host, r = rectOf(tgt);
    const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
    const app = eo(seg(t, a, tp.t)), rel = seg(t, tp.t, z);
    const sx = cx + 70 * (1 - app), sy = cy + 120 * (1 - app);
    const squash = t >= tp.t ? 1 - .25 * Math.sin(Math.PI * seg(t, tp.t, tp.t + .18)) : 1;
    Object.assign(dot.style, {left: sx + 'px', top: sy + 'px', opacity: Math.min(app * 1.6, 1) * (1 - seg(rel, .45, 1)), transform: `scale(${lerp(1.25, 1, app) * squash})`});
    const rp = seg(t, tp.t, tp.t + .45);
    Object.assign(ring.style, {left: cx + 'px', top: cy + 'px', opacity: rp > 0 ? (1 - rp) : 0, transform: `scale(${1 + 1.8 * eo(rp)})`});
    if (tp.id === 'thumb' && t > T.editor) continue;           // thumbnail expands right after the tap: no box around it
    const h = seg(t, a + .15, tp.t - .05) * (1 - seg(t, tp.t + .1, tp.t + .3)), pad = 6;
    Object.assign(hl.style, {left: r.x - pad + 'px', top: r.y - pad + 'px', width: r.w + 2 * pad + 'px', height: r.h + 2 * pad + 'px',
      borderRadius: tp.r === '50%' ? '50%' : `calc(${tp.r} + ${pad}px)`, opacity: h});
    const pr = seg(t, tp.t - .02, tp.t + .05) * (1 - seg(t, tp.t + .2, tp.t + .35));
    const p = tgt.querySelector(':scope > .press'); if (p) p.style.opacity = pr;
    if (tp.id !== 'thumb') tgt.style.transform = `scale(${1 - .08 * pr})`;
  }
}

// ===== frame =====
window.renderFrame = function (t) {
  const intro = eo(seg(t, 0, .5)), outro = eio(seg(t, T.end, T.end + .7));
  const sc = lerp(.97, 1, intro) * lerp(1, .64, outro), py = lerp(PTOP + 20, PTOP, intro) + outro * 460;
  phone.style.transform = `translateY(${py}px) scale(${sc})`;
  [0, 1, 2].forEach(i => {
    const a = STEP[i], b = i < 2 ? STEP[i + 1] : T.end, pin = eo(seg(t, a, a + .3)), pout = seg(t, b - .12, b + .12);
    $('c' + i).style.opacity = pin * (1 - pout);
    $('c' + i).style.transform = `translateY(${(1 - pin) * 26 - pout * 20}px)`;
  });
  $('tag').style.opacity = 1 - seg(t, T.end, T.end + .3);
  [['e0', T.end + .35], ['e1', T.end + .7]].forEach(([id, a]) => { const e = eo(seg(t, a, a + .4));
    $(id).style.cssText = `opacity:${e};transform:translateY(${(1 - e) * 40}px);filter:blur(${(1 - e) * 10}px)`; });

  // screenshot: flash, shrink to bottom-left; tap → grows into the editor
  $('flash').style.opacity = t > T.shot ? Math.max(0, 1 - (t - T.shot) / .22) * .9 : 0;
  const sh = eo(seg(t, T.shot + .05, T.shot + .5)), ed = eio(seg(t, T.editor, T.editor + .45)), th = $('thumb');
  let x = lerp(0, TX, sh), y = lerp(0, TY, sh), w = lerp(PT[0], TW, sh), r = lerp(PR / K - 4, 10, sh);
  if (ed > 0) { x = lerp(TX, EX, ed); y = lerp(TY, EY, ed); w = lerp(TW, EW, ed); r = lerp(10, 34, ed); }
  box(th, x, y, w, r, t > T.shot ? 1 : 0);
  const k = w / PT[0];
  th.style.boxShadow = ed > 0 ? 'none' : sh > 0 ? `0 0 0 ${3 / k}px #fff, 0 ${8 / k}px ${24 / k}px rgba(0,0,0,${.28 * sh})` : 'none';
  $('editor').style.opacity = ed;
  $('crop').style.opacity = seg(t, T.editor + .35, T.editor + .55);

  // share sheet (glass) up / down
  const so = seg(t, T.sheet, T.sheet + .5), sd = eio(seg(t, T.out, T.out + .35));
  $('sheet').style.transform = `translateY(${(1 - back(so)) * 560 + sd * 560}px)`;
  $('scrim').style.opacity = .25 * so * (1 - sd);

  // notification banner drops in from the top; screenshot copy flies up into its icon
  const xi = back(seg(t, T.fly - .1, T.fly + .4)), xo = eio(seg(t, T.end - .25, T.end + .1));
  $('ext').style.transform = `translateY(${(1 - xi) * -160 - xo * 160}px) scale(${lerp(.92, 1, cl(xi))})`;
  const pop = Math.sin(Math.PI * seg(t, T.check - .02, T.check + .22));
  $('tIcon').style.transform = `scale(${1 + .12 * pop})`;
  const f = seg(t, T.fly, T.check);
  if (f > 0 && f < 1) {
    const fe = eio(f), ir = rectOf($('tIcon'));
    box($('fly'), lerp(EX, ir.x + 10, fe) + Math.sin(fe * Math.PI) * 60, lerp(EY, ir.y + 4, fe), lerp(EW, 24, fe), lerp(30, 6, fe), 1 - seg(f, .85, 1));
  } else $('fly').style.opacity = 0;
  taps(t);
};

window.TIMELINE = {duration: T.dur, events: [{type: 'shutter', t: T.shot}, {type: 'tap', t: T.tapThumb}, {type: 'tap', t: T.tapShare},
  {type: 'slide', t: T.sheet}, {type: 'tap', t: T.tapN}, {type: 'whoosh', t: T.fly}, {type: 'chirp', t: T.check - .05},
  {type: 'ding', t: T.fly}, {type: 'swipe', t: T.end + .35}, {type: 'pop', t: T.end + .7}]};
renderFrame(0);
</script></body></html>
